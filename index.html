<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f1728">
    <meta name="description" content="IS Career Launchpad — a playful career exploration game for BYU Information Systems students.">
    <title>IS Career Launchpad</title>
    <style>/*
 * IS Career Launchpad — “paper map / neon terminal” visual system
 * The scene is intentionally tactile: a midnight desk, map cards as labels,
 * and a bottom honeycomb that makes progression visible without relying on color.
 */
:root {
  --ink: #152238;
  --ink-soft: #4f637d;
  --night: #0f1728;
  --night-2: #16243b;
  --paper: #fbfcff;
  --paper-blue: #eef4ff;
  --line: #ccd9ec;
  --line-strong: #94a9c8;
  --blue: #2770e8;
  --blue-dark: #174fb0;
  --violet: #7b43e6;
  --violet-dark: #4f25a6;
  --green: #00a477;
  --green-dark: #007559;
  --gold: #ffb647;
  --coral: #ff6f5b;
  --cyan: #46d8dc;
  --white: #fff;
  --shadow: 0 16px 40px rgba(21, 34, 56, .13);
  --shadow-tight: 0 8px 18px rgba(21, 34, 56, .14);
  --radius-card: 18px;
  --radius-pill: 999px;
  --font-display: Impact, Haettenschweiler, "Arial Black", sans-serif;
  --font-body: "Trebuchet MS", Verdana, sans-serif;
  --font-mono: "Courier New", Courier, monospace;
  --dock-height: 126px;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html { min-width: 320px; scroll-padding-bottom: calc(var(--dock-height) + 28px); background: var(--night); }

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  padding-bottom: var(--dock-height);
  color: var(--ink);
  background:
    radial-gradient(circle at 88% 8%, rgba(70, 216, 220, .15), transparent 29rem),
    radial-gradient(circle at 10% 48%, rgba(123, 67, 230, .16), transparent 32rem),
    linear-gradient(152deg, #f4f8ff 0%, #f8faff 55%, #edf4fb 100%);
  font-family: var(--font-body);
  line-height: 1.45;
}

body::before {
  position: fixed;
  z-index: 20;
  inset: 0;
  pointer-events: none;
  opacity: .07;
  content: "";
  background-image: repeating-linear-gradient(0deg, rgba(13, 26, 49, .22) 0 1px, transparent 1px 4px);
  mix-blend-mode: multiply;
}

button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }

button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}

.skip-link {
  position: fixed;
  z-index: 100;
  top: 10px;
  left: 10px;
  padding: 10px 16px;
  border-radius: var(--radius-pill);
  color: var(--night);
  background: var(--gold);
  font-weight: 800;
  transform: translateY(-160%);
  transition: transform .18s ease;
}
.skip-link:focus { transform: translateY(0); }

.site-header {
  position: relative;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 78px;
  padding: 15px clamp(18px, 4vw, 64px);
  color: var(--white);
  background: var(--night);
  box-shadow: 0 5px 0 rgba(20, 34, 57, .1), 0 13px 30px rgba(15, 23, 40, .14);
}

.brand-lockup { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  position: relative;
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  color: var(--night);
  background: var(--gold);
  clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%);
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: .06em;
}
.brand-mark i { position: absolute; right: 7px; bottom: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--coral); }
.eyebrow { margin: 0; color: var(--cyan); font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: .11em; }
.brand-name { margin: 1px 0 0; font-family: var(--font-display); font-size: clamp(18px, 2vw, 23px); letter-spacing: .08em; line-height: 1; }
.brand-name span { color: var(--gold); }
.header-status { display: flex; align-items: center; gap: 10px; color: #b9c8e3; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; }
.status-lamp { width: 9px; height: 9px; border: 2px solid var(--cyan); border-radius: 50%; box-shadow: 0 0 0 4px rgba(70, 216, 220, .13), 0 0 14px var(--cyan); }

#app { position: relative; z-index: 1; min-height: calc(100vh - 78px); padding: clamp(34px, 6vw, 82px) clamp(16px, 5vw, 72px) 180px; }
.screen { width: min(1240px, 100%); margin: 0 auto; animation: screen-in .45s cubic-bezier(.2, .7, .25, 1) both; }
@keyframes screen-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

.screen-kicker { margin: 0 0 10px; color: var(--blue-dark); font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
.screen-title { max-width: 850px; margin: 0; color: var(--ink); font-family: var(--font-display); font-size: clamp(42px, 7vw, 86px); font-weight: 900; letter-spacing: -.015em; line-height: .94; text-transform: uppercase; }
.screen-title em { color: var(--blue); font-style: normal; }
.screen-subtitle { max-width: 660px; margin: 18px 0 0; color: var(--ink-soft); font-size: clamp(16px, 2vw, 20px); }
.screen-heading-row { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 30px; }
.screen-heading-row .screen-title { font-size: clamp(34px, 5vw, 62px); }

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 11px 20px;
  border: 2px solid transparent;
  border-radius: 10px;
  color: var(--white);
  background: var(--blue);
  box-shadow: 0 5px 0 var(--blue-dark), var(--shadow-tight);
  font-weight: 900;
  letter-spacing: .03em;
  transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.button:hover { background: #3b80ef; transform: translateY(-2px); box-shadow: 0 7px 0 var(--blue-dark), var(--shadow-tight); }
.button:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--blue-dark); }
.button-secondary { color: var(--blue-dark); border-color: var(--line-strong); background: var(--white); box-shadow: 0 4px 0 var(--line-strong); }
.button-secondary:hover { color: var(--ink); background: var(--paper-blue); box-shadow: 0 6px 0 var(--line-strong); }
.button-quiet { min-height: 44px; padding: 7px 12px; border-color: #40526f; color: #dce7f9; background: transparent; box-shadow: none; font-size: 11px; }
.button-quiet:hover { color: var(--white); background: #263752; box-shadow: none; }
.button-coral { background: var(--coral); box-shadow: 0 5px 0 #c84545, var(--shadow-tight); }
.button-coral:hover { background: #ff826d; box-shadow: 0 7px 0 #c84545, var(--shadow-tight); }

.hero-screen { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(300px, .9fr); align-items: center; gap: clamp(28px, 7vw, 100px); min-height: 520px; }
.hero-copy { position: relative; }
.hero-copy::before { position: absolute; z-index: -1; top: -58px; left: -55px; width: 210px; height: 210px; border-radius: 50%; background: rgba(70, 216, 220, .18); content: ""; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 31px; }
.hero-note { display: flex; align-items: center; gap: 8px; margin: 26px 0 0; color: var(--ink-soft); font-family: var(--font-mono); font-size: 11px; }
.hero-note b { color: var(--coral); font-size: 16px; }

.launch-card { position: relative; padding: 30px 27px 26px; border: 2px solid #c6d6ed; border-radius: var(--radius-card); background: rgba(255, 255, 255, .83); box-shadow: var(--shadow); transform: rotate(1.2deg); }
.launch-card::before { position: absolute; top: -14px; left: 20%; width: 76px; height: 24px; border-radius: 2px; background: rgba(255, 182, 71, .72); box-shadow: 0 2px 4px rgba(21, 34, 56, .1); content: ""; transform: rotate(-4deg); }
.launch-card::after { position: absolute; inset: 10px; border: 1px dashed #c7d5e8; border-radius: 12px; pointer-events: none; content: ""; }
.card-label { margin: 0 0 13px; color: var(--violet); font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.terminal-lines { display: grid; gap: 14px; margin: 20px 0 27px; }
.terminal-line { display: grid; grid-template-columns: 35px 1fr; align-items: center; gap: 10px; }
.terminal-line > span:first-child { display: grid; place-items: center; width: 31px; height: 31px; border: 2px solid var(--line-strong); border-radius: 50%; color: var(--blue-dark); font-family: var(--font-mono); font-size: 12px; font-weight: 700; }
.terminal-line p { margin: 0; color: var(--ink); font-size: 14px; font-weight: 700; }
.terminal-line small { display: block; margin-top: 2px; color: var(--ink-soft); font-size: 11px; font-weight: 400; }

.avatar-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; margin: 29px 0; }
.avatar-choice { position: relative; min-height: 126px; padding: 13px; border: 2px solid var(--line); border-radius: 14px; color: var(--ink); background: var(--white); text-align: left; transition: border-color .16s ease, transform .16s ease, box-shadow .16s ease; }
.avatar-choice:hover { border-color: var(--blue); transform: translateY(-3px); box-shadow: var(--shadow-tight); }
.avatar-choice.is-selected { border-color: var(--gold); box-shadow: inset 0 0 0 3px rgba(255, 182, 71, .25), var(--shadow-tight); }
.avatar-choice.is-selected::after { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--green); content: ""; }
.avatar-portrait { display: grid; place-items: center; width: 53px; height: 53px; margin-bottom: 10px; border: 3px solid var(--ink); border-radius: 18px 18px 21px 9px; color: var(--white); background: var(--blue); font-family: var(--font-display); font-size: 23px; }
.avatar-choice:nth-child(2) .avatar-portrait { background: var(--violet); border-radius: 50% 50% 16px 16px; }
.avatar-choice:nth-child(3) .avatar-portrait { background: var(--green); border-radius: 11px 24px 11px 24px; }
.avatar-choice:nth-child(4) .avatar-portrait { background: var(--coral); border-radius: 50% 13px 50% 13px; }
.avatar-name { display: block; font-weight: 900; font-size: 13px; }
.avatar-tag { display: block; margin-top: 2px; color: var(--ink-soft); font-family: var(--font-mono); font-size: 10px; }

.skill-picker { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin: 32px 0; }
.skill-card { display: flex; min-height: 102px; align-items: center; gap: 13px; padding: 14px; border: 2px solid var(--line); border-radius: 15px; color: var(--ink); background: rgba(255,255,255,.83); text-align: left; transition: transform .16s ease, border-color .16s ease, background .16s ease; }
.skill-card:hover { border-color: var(--blue); background: var(--white); transform: translateY(-2px); }
.skill-card.is-selected { border-color: var(--green); background: #f0fffa; box-shadow: inset 0 0 0 2px rgba(0, 164, 119, .12); }
.skill-glyph, .mini-glyph { display: grid; flex: 0 0 47px; place-items: center; width: 47px; height: 54px; color: var(--white); background: var(--blue); clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); font-family: var(--font-display); font-size: 17px; }
.skill-card:nth-child(3n) .skill-glyph { background: var(--violet); }
.skill-card:nth-child(3n + 1) .skill-glyph { background: var(--green); }
.skill-card strong { display: block; font-size: 14px; }
.skill-card small { display: block; margin-top: 3px; color: var(--ink-soft); font-size: 11px; }
.selection-meter { display: flex; align-items: center; justify-content: space-between; max-width: 430px; margin: 15px 0 0; color: var(--ink-soft); font-family: var(--font-mono); font-size: 12px; }
.meter-track { width: 180px; height: 8px; overflow: hidden; border-radius: 10px; background: #d8e2f1; }
.meter-track i { display: block; width: var(--meter, 0%); height: 100%; border-radius: inherit; background: var(--green); transition: width .3s ease; }

.map-screen { max-width: 1430px; }
.map-intro { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 28px; }
.map-intro .screen-title { font-size: clamp(37px, 5.6vw, 72px); }
.map-progress { min-width: 200px; padding: 13px 15px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.7); color: var(--ink-soft); font-family: var(--font-mono); font-size: 11px; }
.map-progress strong { display: block; margin-bottom: 5px; color: var(--ink); font-size: 14px; }
.map-progress-bar { height: 7px; overflow: hidden; border-radius: 9px; background: #d9e3f1; }
.map-progress-bar i { display: block; width: var(--progress, 16%); height: 100%; border-radius: inherit; background: var(--green); transition: width .4s ease; }
.map-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0 0 22px; color: var(--ink-soft); font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; }
.map-legend span { display: inline-flex; align-items: center; gap: 6px; }
.map-legend i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.map-legend .legend-open { color: var(--blue); }.map-legend .legend-done { color: var(--green); }.map-legend .legend-lock { color: #98a9c0; }
.map-board { position: relative; overflow: hidden; padding: clamp(18px, 4vw, 45px) clamp(12px, 3.5vw, 42px) 35px; border: 2px solid #c5d5eb; border-radius: 24px; background: rgba(244, 248, 255, .72); box-shadow: var(--shadow); }
.map-board::before { position: absolute; inset: 0; opacity: .55; pointer-events: none; content: ""; background-image: linear-gradient(rgba(133, 157, 192, .11) 1px, transparent 1px), linear-gradient(90deg, rgba(133, 157, 192, .11) 1px, transparent 1px); background-size: 40px 40px; }
.map-board::after { position: absolute; right: -75px; bottom: -110px; width: 280px; height: 280px; border-radius: 50%; background: rgba(70, 216, 220, .15); content: ""; }
.map-start { position: relative; z-index: 1; width: min(390px, 90%); margin: 0 auto 35px; padding: 16px 21px; border: 2px solid var(--line-strong); border-radius: 15px; background: var(--white); text-align: center; box-shadow: var(--shadow-tight); }
.map-start::after { position: absolute; bottom: -36px; left: 50%; width: 2px; height: 35px; background: var(--line-strong); content: ""; }
.map-start small { display: block; color: var(--blue-dark); font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: .12em; }
.map-start strong { display: block; margin-top: 5px; font-family: var(--font-display); font-size: clamp(18px, 3vw, 25px); letter-spacing: .02em; text-transform: uppercase; }
.map-regions { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(13px, 2vw, 26px); }
.map-region { position: relative; min-width: 0; }
.map-region:not(:last-child)::after { position: absolute; top: 46px; right: -15px; width: 16px; height: 2px; background: var(--line-strong); content: ""; }
.region-card { min-height: 91px; padding: 15px 15px 13px; border-radius: 15px; color: var(--white); box-shadow: var(--shadow-tight); }
.region-card h2 { margin: 0; font-family: var(--font-display); font-size: clamp(19px, 2.3vw, 28px); letter-spacing: .03em; line-height: 1; text-transform: uppercase; }
.region-card p { margin: 8px 0 0; color: rgba(255,255,255,.83); font-size: 11px; }
.region-build .region-card { background: var(--blue); }.region-analyze .region-card { background: var(--violet); }.region-people .region-card { background: var(--green); }
.map-domain-group { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; margin-top: 28px; }
.map-domain-group::before { position: absolute; top: -16px; left: 25%; width: 50%; height: 15px; border-top: 2px solid var(--line-strong); border-left: 2px solid var(--line-strong); border-right: 2px solid var(--line-strong); content: ""; }
.map-domain { min-width: 0; padding: 14px 11px 11px; border: 2px solid var(--line-strong); border-radius: 13px; background: rgba(255,255,255,.88); box-shadow: 0 4px 0 rgba(148,169,200,.22); }
.map-domain h3 { margin: 0; color: var(--ink); font-size: clamp(13px, 1.5vw, 17px); line-height: 1.08; }
.map-domain p { min-height: 31px; margin: 5px 0 12px; color: var(--ink-soft); font-size: 10px; }
.node-stack { display: grid; gap: 7px; }
.map-node { position: relative; display: block; width: 100%; min-height: 51px; padding: 8px 9px 7px 13px; border: 1px solid var(--line); border-left: 5px solid var(--blue); border-radius: 9px; color: var(--ink); background: var(--paper-blue); text-align: left; transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease; }
.map-node:hover:not(:disabled) { border-color: var(--blue); transform: translateX(3px); box-shadow: 0 4px 9px rgba(39,112,232,.14); }
.map-node strong { display: block; font-size: 11px; line-height: 1.1; }
.map-node small { display: block; margin-top: 3px; color: var(--ink-soft); font-family: var(--font-mono); font-size: 9px; }
.map-node .node-state { position: absolute; top: 8px; right: 8px; width: 9px; height: 9px; border: 2px solid currentColor; border-radius: 50%; color: var(--blue); }
.map-node.is-complete { border-left-color: var(--green); background: #effcf8; }.map-node.is-complete .node-state { color: var(--green); background: var(--green); }
.map-node.is-locked { border-left-color: #9aacbf; color: #7e8fa5; background: #f0f3f8; }.map-node.is-locked .node-state { color: #9aacbf; background: transparent; }
.map-node.is-locked small { color: #8fa0b6; }
.specialization-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; margin-top: 23px; }
.specialization-row .map-node { min-height: 70px; border-left-width: 3px; padding: 10px 8px; text-align: center; }
.specialization-row .map-node strong { font-size: 10px; }.specialization-row .map-node small { font-size: 8px; }
.map-footer { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 29px; color: var(--ink-soft); font-family: var(--font-mono); font-size: 10px; text-align: center; }.map-footer::before, .map-footer::after { width: 60px; height: 1px; background: var(--line); content: ""; }

.career-layout { display: grid; grid-template-columns: minmax(0, .65fr) minmax(0, 1.35fr); gap: 22px; align-items: start; }
.career-identity { position: sticky; top: 22px; padding: 24px; border-radius: 18px; color: var(--white); background: var(--night); box-shadow: var(--shadow); }
.career-identity .mini-glyph { margin-bottom: 17px; background: var(--gold); color: var(--night); }
.career-identity h1 { margin: 0; color: var(--white); font-family: var(--font-display); font-size: clamp(33px, 4vw, 55px); line-height: .95; text-transform: uppercase; }
.career-identity p { margin: 13px 0 0; color: #c4d2e8; font-size: 14px; }
.career-pill-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 21px; }.career-pill { padding: 7px 9px; border: 1px solid #4c6281; border-radius: 7px; color: var(--cyan); font-family: var(--font-mono); font-size: 10px; }
.career-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }.fact-card { padding: 18px; border: 2px solid var(--line); border-radius: 14px; background: var(--white); }.fact-card h2 { margin: 0 0 8px; color: var(--blue-dark); font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }.fact-card p { margin: 0; font-size: 13px; }.fact-card--wide { grid-column: 1 / -1; }
.career-actions { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 21px; }

.mission-screen { width: min(920px, 100%); }
.mission-topline { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 24px; color: var(--ink-soft); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; }.mission-topline strong { color: var(--coral); }
.mission-card { position: relative; overflow: hidden; padding: clamp(23px, 5vw, 43px); border: 2px solid #c5d5eb; border-radius: 21px; background: var(--white); box-shadow: var(--shadow); }.mission-card::before { position: absolute; top: 0; right: 0; width: 38%; height: 7px; background: var(--gold); content: ""; }
.mission-card h1 { max-width: 700px; margin: 0; font-family: var(--font-display); font-size: clamp(33px, 5vw, 60px); line-height: .95; text-transform: uppercase; }.mission-card h1 em { color: var(--blue); font-style: normal; }.mission-card > p { max-width: 650px; margin: 17px 0 0; color: var(--ink-soft); }
.mission-visual { display: grid; place-items: center; min-height: 220px; margin: 27px 0 23px; border: 2px dashed var(--line-strong); border-radius: 14px; background: linear-gradient(135deg, #eef5ff, #f8f2ff); text-align: center; }.mission-visual .placeholder-icon { font-size: 54px; line-height: 1; }.mission-visual strong { display: block; margin-top: 10px; color: var(--ink); font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }.mission-visual small { display: block; margin-top: 6px; color: var(--ink-soft); }.mission-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 13px; }.mission-actions .button-secondary { margin-left: auto; }

.feedback-card { margin-top: 20px; padding: 19px; border-left: 5px solid var(--green); border-radius: 10px; background: #effcf8; }.feedback-card h2 { margin: 0; color: var(--green-dark); font-size: 16px; }.feedback-card p { margin: 7px 0 0; font-size: 13px; }.strong-answer { margin-top: 14px; padding: 13px; border-radius: 8px; background: var(--white); }.strong-answer strong { display: block; margin-bottom: 5px; color: var(--violet-dark); font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }.strong-answer p { margin: 0; font-size: 12px; }

.skill-dock { position: fixed; z-index: 10; right: 0; bottom: 0; left: 0; min-height: var(--dock-height); color: var(--white); background: rgba(15, 23, 40, .97); box-shadow: 0 -9px 35px rgba(15, 23, 40, .2); }
.dock-inner { display: flex; align-items: center; gap: clamp(15px, 3vw, 38px); width: min(1440px, 100%); min-height: var(--dock-height); margin: 0 auto; padding: 12px clamp(14px, 4vw, 56px); }.dock-label { display: flex; flex: 0 0 165px; align-items: center; gap: 10px; }.dock-pip { width: 8px; height: 41px; border-radius: 4px; background: var(--gold); box-shadow: 0 0 15px rgba(255,182,71,.6); }.dock-label h2 { margin: 0; font-family: var(--font-display); font-size: 17px; letter-spacing: .08em; }.dock-label p { margin: 3px 0 0; color: #aebed6; font-family: var(--font-mono); font-size: 10px; line-height: 1.2; }.hex-track { display: flex; flex: 1; align-items: center; gap: 7px; min-width: 0; overflow-x: auto; padding: 4px 2px 9px; scrollbar-width: thin; scrollbar-color: #49617f transparent; }.hex-track::-webkit-scrollbar { height: 5px; }.hex-track::-webkit-scrollbar-thumb { border-radius: 8px; background: #49617f; }.hex-empty { display: flex; align-items: center; gap: 8px; min-width: 142px; color: #9caeca; font-family: var(--font-mono); font-size: 10px; line-height: 1.1; }.hex-empty > span:first-child { display: grid; flex: 0 0 38px; place-items: center; width: 38px; height: 43px; border: 1px dashed #6380a5; color: #91aacb; clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); font-size: 18px; }.hex-item { position: relative; display: grid; flex: 0 0 72px; place-items: center; min-height: 84px; color: var(--night); background: var(--gold); clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); text-align: center; animation: skill-pop .46s cubic-bezier(.2, .9, .3, 1.2) both; }.hex-item:nth-child(3n) { background: var(--cyan); }.hex-item:nth-child(3n + 1) { background: #bda3ff; }.hex-item strong { max-width: 54px; font-size: 10px; line-height: 1.02; }.hex-item small { display: block; margin-top: 4px; font-family: var(--font-mono); font-size: 7px; font-weight: 700; text-transform: uppercase; }.hex-item[aria-label] { cursor: help; }.hex-item:hover { filter: brightness(1.12); transform: translateY(-4px); }.hex-flight { position: fixed; z-index: 50; width: 44px; height: 51px; pointer-events: none; background: var(--gold); clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); animation: skill-flight .7s ease-in-out both; }.dock-tip { flex: 0 0 auto; color: #8fa3c2; font-family: var(--font-mono); font-size: 9px; white-space: nowrap; }.dock-tip span { color: var(--gold); font-size: 17px; vertical-align: -2px; }

/* -------------------------------------------------------------------------- */
/* Runtime view contracts                                                     */
/* These selectors match the small, data-driven renderer in app.js. Keeping  */

.screen--landing { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(290px, .72fr); align-items: center; gap: clamp(28px, 7vw, 100px); min-height: 530px; }

.landing-sky::after { position: absolute; right: 9%; bottom: 8%; width: 230px; height: 100px; border: 2px solid rgba(39,112,232,.17); border-radius: 50%; content: ""; transform: rotate(-15deg); }

.planet { position: absolute; right: 14%; bottom: 17%; width: 150px; height: 150px; border: 11px solid rgba(39,112,232,.15); border-radius: 50%; box-shadow: inset -16px -12px rgba(123,67,230,.1); }.planet::after { position: absolute; top: 55px; left: -30px; width: 190px; height: 22px; border: 3px solid rgba(0,164,119,.2); border-radius: 50%; content: ""; transform: rotate(-18deg); }
.landing-copy { position: relative; z-index: 1; }.landing-copy h1 { max-width: 760px; margin: 0; color: var(--ink); font-family: var(--font-display); font-size: clamp(50px, 7vw, 94px); line-height: .9; text-transform: uppercase; }.landing-copy h1 em { color: var(--blue); font-style: normal; }.landing-copy .lede { max-width: 610px; margin: 21px 0 0; color: var(--ink-soft); font-size: clamp(16px, 2vw, 20px); }.landing-note { position: absolute; right: 0; bottom: -20px; margin: 0; color: var(--ink-soft); font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
.start-card { max-width: 555px; margin-top: 31px; padding: 20px 22px 21px; border: 2px solid #c3d3e9; border-radius: 16px; background: rgba(255,255,255,.91); box-shadow: var(--shadow); }.start-card > label { display: block; margin-bottom: 7px; color: var(--ink); font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }.start-card input { display: block; width: 100%; min-height: 46px; padding: 9px 12px; border: 2px solid var(--line); border-radius: 8px; color: var(--ink); background: #f8faff; font-size: 15px; }.start-card input:focus { border-color: var(--blue); outline: 3px solid rgba(39,112,232,.17); }.start-card fieldset { margin: 17px 0 19px; padding: 0; border: 0; }.start-card legend { margin-bottom: 8px; color: var(--ink-soft); font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }.start-card .avatar-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 0; }.start-card .avatar-choice { display: flex; min-height: 77px; flex-direction: column; align-items: center; justify-content: center; padding: 8px; text-align: center; }.avatar-glyph { display: grid; place-items: center; width: 35px; height: 35px; margin-bottom: 5px; border-radius: 11px; color: var(--white); background: var(--blue); font-family: var(--font-display); font-size: 19px; }.avatar-choice:nth-child(2) .avatar-glyph { background: var(--violet); }.avatar-choice:nth-child(3) .avatar-glyph { background: var(--green); }.avatar-choice:nth-child(4) .avatar-glyph { background: var(--coral); }.start-card .avatar-choice > span:last-child { font-size: 10px; font-weight: 800; }.button--wide { width: 100%; }.button--primary { color: var(--white); background: var(--blue); }.text-button { min-height: 44px; padding: 7px 0; border: 0; color: var(--blue-dark); background: transparent; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }.text-button:hover /* Release-gate refinements: focus safety, readable locked states, and a true
   growing honeycomb dock without changing the mini-game component contract. */
button, [tabindex] { scroll-margin-bottom: calc(var(--dock-height) + 28px); }
.button--quiet { min-height: 44px; }
.map-side { display: grid; justify-items: end; gap: 10px; }
.map-side .button { width: auto; }
.region-heading { display: block; margin: 0; font-family: var(--font-display); font-size: clamp(19px, 2.2vw, 28px); line-height: 1; text-transform: uppercase; }
.region-description { display: block; margin-top: 7px; color: var(--white); font-size: 11px; font-weight: 700; line-height: 1.25; }
.map-domain.is-future .node-title, .map-node.is-future .node-title,
.map-domain.is-locked .node-title, .map-node.is-locked .node-title { color: #536981; }
.career-stat small { color: #536981; font-size: 11px; }
.skill-honeycomb, .hex-track { gap: 0; padding-left: 8px; padding-bottom: 19px; }
.skill-hex, .hex-item { margin-left: -17px; }
.skill-hex:first-child, .hex-item:first-child { margin-left: 0; }
.skill-hex:nth-child(even), .hex-item:nth-child(even) { top: 20px; }
.skill-hex:hover, .skill-hex:focus-visible, .hex-item:hover, .hex-item:focus-visible { z-index: 2; }
.toast-region { top: 92px; bottom: auto; }
.toast-region .toast { position: static; right: auto; bottom: auto; }
.hex-flight { z-index: 90; background: var(--skill-color, var(--gold)); animation: skill-flight .7s cubic-bezier(.2,.8,.25,1) both; }
@keyframes skill-flight { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.35) rotate(-25deg); } 24% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--flight-x, 0px)), calc(-50% + var(--flight-y, 0px))) scale(.8) rotate(18deg); } }

@media (max-width: 767px) {
  .topbar .button--quiet { min-height: 44px; }
  .map-side { justify-items: start; margin-top: 14px; }
  .toast-region { top: 76px; bottom: auto; }

}

/* Interview practice and research disclosures. The visual language keeps the
   field-guide palette, but uses a quiet editorial layout so writing remains
   the focus. */
.interview-screen { width: min(1120px, 100%); }
.interview-screen .topbar .button--quiet, .screen--career > .topbar .button--quiet { border-color: var(--line-strong); color: var(--ink); background: rgba(255,255,255,.65); }
.interview-screen .topbar .button--quiet:hover, .screen--career > .topbar .button--quiet:hover { color: var(--white); background: var(--night); }
.interview-intro-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr); gap: clamp(28px, 7vw, 90px); align-items: center; min-height: 450px; }
.interview-intro h1, .debrief-card h1 { max-width: 760px; margin: 0; color: var(--ink); font-family: var(--font-display); font-size: clamp(46px, 7vw, 85px); line-height: .9; text-transform: uppercase; }
.interview-intro h1 em, .debrief-card h1 em { color: var(--blue); font-style: normal; }
.interview-lede { max-width: 620px; margin: 20px 0 0; color: var(--ink-soft); font-size: 17px; }
.interview-expectations { display: grid; gap: 10px; margin-top: 28px; color: var(--ink); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; }
.interview-expectations span { display: flex; align-items: center; gap: 10px; }
.interview-expectations b { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: var(--white); background: var(--violet); font-size: 10px; }
.interview-welcome-card, .debrief-next { padding: clamp(22px, 4vw, 35px); border: 2px solid var(--line); border-radius: 17px; background: var(--white); box-shadow: var(--shadow); }
.interview-welcome-card strong, .debrief-next strong { display: block; margin-top: 8px; color: var(--ink); font-family: var(--font-display); font-size: 28px; line-height: .98; text-transform: uppercase; }
.interview-welcome-card p, .debrief-next p { margin: 10px 0 20px; color: var(--ink-soft); font-size: 13px; }
.interview-welcome-card .text-button { width: 100%; margin-top: 14px; text-align: center; }
.interview-layout { display: grid; grid-template-columns: 180px minmax(0, 760px); gap: clamp(22px, 5vw, 75px); align-items: start; justify-content: center; padding-top: 25px; }
.interview-rail { position: sticky; top: 26px; display: grid; gap: 13px; padding-top: 7px; }
.rail-step { display: grid; grid-template-columns: 35px 1fr; align-items: center; gap: 10px; color: #92a1b7; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; }
.rail-step span { display: grid; place-items: center; width: 33px; height: 33px; border: 2px solid #b8c7da; border-radius: 50%; }
.rail-step.is-current { color: var(--blue-dark); font-weight: 700; }.rail-step.is-current span { border-color: var(--blue); color: var(--white); background: var(--blue); }.rail-step.is-done { color: var(--green-dark); }.rail-step.is-done span { border-color: var(--green); color: var(--white); background: var(--green); }
.question-card { padding: clamp(22px, 5vw, 47px); border: 2px solid var(--line); border-radius: 19px; background: var(--white); box-shadow: var(--shadow); }
.question-card h1 { margin: 6px 0 0; color: var(--ink); font-family: var(--font-display); font-size: clamp(31px, 4.3vw, 54px); line-height: .96; text-transform: uppercase; }
.question-helper { margin: 14px 0 26px; color: var(--ink-soft); font-size: 14px; }
.question-card label { display: block; margin-bottom: 7px; color: var(--ink); font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.question-card textarea { display: block; width: 100%; min-height: 205px; resize: vertical; padding: 15px; border: 2px solid var(--line-strong); border-radius: 11px; color: var(--ink); background: #fbfdff; font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.question-card textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(39,112,232,.13); outline: 0; }
.answer-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 8px; color: var(--ink-soft); font-family: var(--font-mono); font-size: 10px; }
.answer-meta span:first-child { color: var(--blue-dark); font-weight: 700; }
.hint-disclosure, .strong-answer { margin-top: 22px; border-top: 1px solid var(--line); color: var(--ink-soft); }
.hint-disclosure summary, .strong-answer summary { display: flex; align-items: center; min-height: 44px; padding: 8px 0; color: var(--blue-dark); cursor: pointer; font-family: var(--font-mono); font-size: 10px; font-weight: 700; text-transform: uppercase; }
.hint-disclosure p, .strong-answer p { margin: 4px 0 0; font-size: 13px; }
.question-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 13px; margin-top: 24px; }
.feedback-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, .85fr); gap: 20px; align-items: start; padding-top: 25px; }
.feedback-question { position: sticky; top: 20px; }.feedback-question h1 { font-size: clamp(28px, 4vw, 46px); }.answer-quote { margin: 24px 0 16px; padding: 18px; border-left: 4px solid var(--gold); border-radius: 0 10px 10px 0; color: var(--ink); background: #fffaf1; font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
.feedback-card { padding: clamp(22px, 4vw, 34px); border: 2px solid var(--line); border-radius: 17px; background: var(--white); box-shadow: var(--shadow); }.feedback-level { display: inline-block; padding: 7px 10px; border-radius: 7px; font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }.feedback-level--strong { color: #006d53; background: #dff9ef; }.feedback-level--developing { color: #825400; background: #fff0ca; }.feedback-level--starting { color: #8a3940; background: #ffe4e2; }.feedback-summary { margin: 10px 0 25px; color: var(--ink-soft); font-family: var(--font-mono); font-size: 10px; }
.feedback-card section { margin-top: 19px; }.feedback-card h2 { margin: 0 0 8px; color: var(--blue-dark); font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }.criteria-list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; font-size: 13px; }.criteria-list--matched li { color: var(--green-dark); }.criteria-list--missing li { color: #a14749; }.muted-copy { margin: 0; color: var(--ink-soft); font-size: 13px; }.feedback-guidance { margin: 24px 0 0; padding: 13px; border-radius: 9px; color: var(--ink-soft); background: var(--paper-blue); font-size: 12px; }.feedback-guidance strong { color: var(--ink); }
.debrief-card { padding: clamp(24px, 5vw, 52px); border: 2px solid var(--line); border-radius: 20px; background: var(--white); box-shadow: var(--shadow); }.debrief-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, .8fr); gap: 26px; margin-top: 36px; }.debrief-list { display: grid; gap: 10px; margin: 11px 0 0; padding: 0; list-style: none; }.debrief-list li { display: grid; grid-template-columns: 35px 1fr auto; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); }.debrief-list li > span { color: var(--blue-dark); font-family: var(--font-mono); font-size: 10px; font-weight: 700; }.debrief-list strong { font-size: 13px; }.debrief-list em { color: var(--green-dark); font-family: var(--font-mono); font-size: 9px; font-style: normal; text-transform: uppercase; }.debrief-next { align-self: start; box-shadow: none; background: #f7f9ff; }.debrief-actions { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 31px; }
.career-sources { margin-top: 20px; border: 2px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.72); }.career-sources summary { padding: 15px 17px; color: var(--blue-dark); cursor: pointer; font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }.source-disclosure { padding: 0 17px 17px; color: var(--ink-soft); font-size: 12px; }.source-disclosure p { margin: 0 0 11px; }.source-list { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }.source-list li { display: grid; gap: 2px; }.source-list a { color: var(--blue-dark); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }.source-list span { color: var(--ink-soft); font-family: var(--font-mono); font-size: 9px; }.practice-card { padding: 18px; border: 2px solid #f5c76e; border-radius: 13px; background: #fffaf1; }.practice-card strong { display: block; margin-top: 5px; color: var(--ink); font-family: var(--font-display); font-size: 24px; line-height: 1; text-transform: uppercase; }.practice-card p { margin: 8px 0 15px; color: var(--ink-soft); font-size: 12px; }.practice-card--soon { border-color: var(--line); background: var(--paper-blue); }
@media (max-width: 980px) { .interview-intro-grid { grid-template-columns: 1fr; min-height: 0; max-width: 720px; margin: 0 auto; }.interview-welcome-card { max-width: 480px; }.interview-layout { grid-template-columns: 1fr; max-width: 760px; margin: 0 auto; }.interview-rail { position: static; grid-template-columns: repeat(3, 1fr); gap: 9px; padding: 0; }.rail-step { grid-template-columns: 30px 1fr; }.rail-step span { width: 29px; height: 29px; }.feedback-grid { grid-template-columns: 1fr; max-width: 760px; margin: 0 auto; }.feedback-question { position: static; }.debrief-grid { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .interview-intro h1, .debrief-card h1 { font-size: 46px; }.interview-lede { font-size: 15px; }.interview-rail { gap: 5px; }.rail-step { display: block; text-align: center; }.rail-step span { margin: 0 auto 5px; }.rail-step small { display: block; font-size: 8px; }.question-card { padding: 21px 16px; }.question-card h1 { font-size: 32px; }.question-card textarea { min-height: 180px; }.question-actions .button { width: 100%; }.debrief-card { padding: 23px 17px; }.debrief-list li { grid-template-columns: 28px 1fr; }.debrief-list em { grid-column: 2; }.debrief-actions .button { width: 100%; } }

@media (prefers-reduced-motion: reduce) { .interview-screen *, .interview-screen *::before, .interview-screen *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
/* Guided RPG journey — skill loadout, shifting world, and avatar travel      */
/* ========================================================================== */

.screen--skills { width: min(1220px, 100%); }
.skills-heading { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 36px; margin-bottom: 30px; }
.skills-heading h1 { max-width: 920px; margin: 0; font-family: var(--font-display); font-size: clamp(43px, 6.2vw, 79px); line-height: .92; text-transform: uppercase; }
.skills-heading h1 em { color: var(--violet); font-style: normal; }
.skills-heading p:not(.screen-kicker) { max-width: 710px; margin: 17px 0 0; color: var(--ink-soft); font-size: 17px; }
.selection-meter { display: grid; place-items: center; width: 130px; min-height: 130px; padding: 14px; border: 2px solid var(--night); border-radius: 50%; color: var(--white); background: var(--night); box-shadow: 0 0 0 9px rgba(39,112,232,.08), var(--shadow); text-align: center; }
.selection-meter strong { font-family: var(--font-display); font-size: 48px; line-height: .75; }
.selection-meter strong span { color: var(--gold); font-size: 23px; }
.selection-meter small { color: #b8c9e2; font-family: var(--font-mono); font-size: 8px; letter-spacing: .08em; text-transform: uppercase; }

.starter-skill-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.starter-skill { position: relative; display: grid; grid-template-rows: auto auto auto 1fr auto; min-height: 225px; overflow: hidden; padding: 17px 16px 14px; border: 2px solid #bdcde4; border-radius: 15px; color: var(--ink); background: rgba(255,255,255,.88); box-shadow: 0 5px 0 rgba(148,169,200,.35); text-align: left; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, opacity .18s ease; }
.starter-skill::after { position: absolute; right: -36px; bottom: -40px; width: 105px; height: 105px; border-radius: 50%; opacity: .13; background: var(--skill-color); content: ""; }
.starter-skill:hover:not([aria-disabled="true"]) { z-index: 2; border-color: var(--skill-color); box-shadow: 0 8px 0 rgba(21,34,56,.18); transform: translateY(-4px) rotate(-.4deg); }
.starter-skill[aria-disabled="true"] { opacity: .46; }
.starter-skill.is-picked { border-color: var(--night); background: var(--skill-color); box-shadow: 0 6px 0 var(--night); transform: translateY(-3px); }
.starter-number { color: var(--ink-soft); font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: .12em; }
.starter-glyph { display: grid; place-items: center; width: 44px; height: 50px; margin: 12px 0 10px; color: var(--night); background: var(--skill-color); clip-path: polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%); font-family: var(--font-mono); font-size: 16px; font-weight: 900; }
.starter-skill.is-picked .starter-glyph { color: var(--white); background: var(--night); }
.starter-skill strong { font-family: var(--font-display); font-size: 21px; letter-spacing: .02em; line-height: 1; text-transform: uppercase; }
.starter-skill small { margin-top: 8px; color: #536981; font-size: 11px; line-height: 1.25; }
.starter-skill.is-picked small, .starter-skill.is-picked .starter-number { color: rgba(15,23,40,.78); }
.pick-state { align-self: end; margin-top: 13px; color: var(--blue-dark); font-family: var(--font-mono); font-size: 9px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
.starter-skill.is-picked .pick-state { color: var(--night); }
.skills-footer { position: sticky; z-index: 9; bottom: 14px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; margin-top: 24px; padding: 14px 16px; border: 1px solid #536981; border-radius: 14px; color: var(--white); background: rgba(15,23,40,.96); box-shadow: 0 14px 34px rgba(15,23,40,.27); }
.skills-footer p { margin: 0; color: #b9cbe4; font-family: var(--font-mono); font-size: 10px; }
.skills-footer .text-button { justify-self: start; color: var(--cyan); }
.skills-footer .button { justify-self: end; }
.skills-footer .button:disabled { color: #8392a8; background: #34445d; box-shadow: 0 4px 0 #1d2b40; }

.world-screen { width: min(1380px, 100%); }
.world-header { display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, 350px); align-items: end; gap: 35px; margin-bottom: 22px; }
.world-header h1 { max-width: 900px; margin: 0; font-family: var(--font-display); font-size: clamp(46px, 6vw, 78px); line-height: .9; text-transform: uppercase; }
.world-header > div:first-child > p:last-child { max-width: 750px; margin: 15px 0 0; color: var(--ink-soft); font-size: 16px; }
.compass-card { position: relative; overflow: hidden; padding: 16px 18px; border: 2px solid var(--region-color); border-radius: 13px; background: rgba(255,255,255,.9); box-shadow: var(--shadow-tight); }
.compass-card::before { position: absolute; top: -24px; right: -17px; width: 78px; height: 88px; opacity: .16; background: var(--region-color); clip-path: polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%); content: ""; }
.compass-card > span { display: block; color: var(--ink-soft); font-family: var(--font-mono); font-size: 8px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.compass-card strong { display: block; margin-top: 4px; color: var(--ink); font-family: var(--font-display); font-size: 27px; line-height: 1; text-transform: uppercase; }
.compass-card small { display: block; margin-top: 6px; color: #536981; font-size: 10px; }
.compass-card .text-button { min-height: 32px; margin-top: 7px; padding: 0; font-size: 10px; }

.rpg-world { position: relative; min-height: 540px; overflow: hidden; border: 3px solid var(--night); border-radius: 23px; background: linear-gradient(#a6d9ee 0 53%, #91c86e 53% 100%); box-shadow: 0 13px 0 #1d3850, 0 28px 55px rgba(15,23,40,.22); isolation: isolate; }
.rpg-world::before { position: absolute; z-index: 0; inset: 0; opacity: .28; background-image: repeating-linear-gradient(0deg, transparent 0 4px, rgba(255,255,255,.16) 4px 5px); content: ""; }
.rpg-world::after { position: absolute; z-index: 2; right: -80px; bottom: -130px; width: 390px; height: 270px; border-radius: 50%; background: #4f9960; box-shadow: -220px 45px 0 45px #5dab62, -470px 61px 0 70px #6bb266, -720px 34px 0 45px #529a5a; content: ""; }
.world-sky { position: absolute; z-index: 0; inset: 0; overflow: hidden; }
.world-sun { position: absolute; top: 44px; right: 10%; width: 79px; height: 79px; border: 7px solid rgba(255,255,255,.42); border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 14px rgba(255,182,71,.2); }
.cloud { position: absolute; width: 110px; height: 23px; border-radius: 999px; opacity: .7; background: var(--white); box-shadow: 28px -12px 0 6px var(--white), 61px 0 0 -2px var(--white); }
.cloud--one { top: 72px; left: 15%; }
.cloud--two { top: 132px; right: 29%; transform: scale(.7); }
.mountain { position: absolute; bottom: 34%; width: 300px; height: 210px; background: #6d8fa5; clip-path: polygon(50% 0,100% 100%,0 100%); }
.mountain::after { position: absolute; top: 0; left: 35%; width: 30%; height: 35%; background: rgba(255,255,255,.7); clip-path: polygon(50% 0,100% 100%,64% 77%,48% 92%,29% 70%,0 100%); content: ""; }
.mountain--one { left: -55px; }
.mountain--two { left: 25%; bottom: 38%; transform: scale(.67); }
.quest-path { position: absolute; z-index: 3; inset: 0; width: 100%; height: 100%; overflow: visible; }
.quest-path path { fill: none; stroke: #f7e4aa; stroke-width: 28px; stroke-linecap: round; stroke-dasharray: 1 10; filter: drop-shadow(0 5px 0 rgba(65,91,52,.25)); }
.terrain--front { position: absolute; z-index: 4; right: -5%; bottom: -95px; left: -5%; height: 185px; border-radius: 50% 50% 0 0; background: #347c51; box-shadow: inset 0 12px rgba(255,255,255,.08); }

.world-landmark, .world-stop, .map-avatar { position: absolute; z-index: 6; left: var(--x); top: var(--y); transform: translate(-50%, -50%); }
.start-camp { display: grid; place-items: center; color: var(--night); }
.start-camp span { display: grid; place-items: center; width: 50px; height: 50px; border: 3px solid var(--night); border-radius: 12px 12px 5px 5px; background: var(--gold); box-shadow: 0 7px 0 rgba(15,23,40,.2); font-size: 23px; }
.start-camp small { margin-top: 7px; padding: 3px 6px; border-radius: 4px; color: var(--white); background: var(--night); font-family: var(--font-mono); font-size: 8px; letter-spacing: .12em; }
.world-stop { display: flex; align-items: center; gap: 10px; width: min(260px, 24vw); min-width: 175px; padding: 10px 12px; border: 3px solid var(--night); border-radius: 13px; color: var(--ink); background: var(--white); box-shadow: 0 8px 0 rgba(15,23,40,.31); text-align: left; transition: transform .18s ease, filter .18s ease, box-shadow .18s ease; }
.world-stop:hover:not(:disabled), .world-stop:focus-visible:not(:disabled) { z-index: 12; filter: brightness(1.04); box-shadow: 0 12px 0 rgba(15,23,40,.31); transform: translate(-50%, calc(-50% - 5px)); }
.world-stop:disabled { cursor: default; }
.stop-icon { display: grid; flex: 0 0 43px; place-items: center; width: 43px; height: 49px; color: var(--white); background: var(--node-color); clip-path: polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%); font-weight: 900; }
.stop-copy { display: block; min-width: 0; }
.stop-copy small { display: block; color: var(--blue-dark); font-family: var(--font-mono); font-size: 8px; font-weight: 900; letter-spacing: .1em; }
.stop-copy strong { display: block; overflow: hidden; margin-top: 2px; font-family: var(--font-display); font-size: 18px; line-height: 1; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
.stop-copy em { display: block; overflow: hidden; margin-top: 4px; color: #536981; font-size: 9px; font-style: normal; text-overflow: ellipsis; white-space: nowrap; }
.world-stop.is-complete { opacity: .86; background: #effcf8; }
.world-stop.is-complete .stop-icon { background: var(--green); }
.world-stop.is-rejected { opacity: .66; filter: grayscale(.8); background: #e5e9ef; }
.world-stop.is-rejected .stop-icon { background: #65758b; }
.map-avatar { z-index: 15; left: var(--to-x); top: var(--to-y); display: grid; place-items: center; pointer-events: none; filter: drop-shadow(0 7px 2px rgba(15,23,40,.28)); }
.map-avatar > span { display: grid; place-items: center; width: 58px; height: 66px; border: 4px solid var(--white); color: var(--white); background: var(--coral); clip-path: polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%); font-family: var(--font-display); font-size: 28px; }
.map-avatar small { margin-top: -2px; padding: 3px 8px; border-radius: 999px; color: var(--white); background: var(--night); font-family: var(--font-mono); font-size: 8px; font-weight: 900; letter-spacing: .08em; }
.map-avatar.avatar-pixel > span { background: var(--blue); }
.map-avatar.avatar-sprout > span { background: var(--green); }
.map-avatar.avatar-orbit > span { background: var(--violet); }
.map-avatar.is-traveling { animation: avatar-travel .9s cubic-bezier(.32,.05,.2,1) both; }
@keyframes avatar-travel { 0% { left: var(--from-x); top: var(--from-y); transform: translate(-50%,-50%) scale(1); } 22% { transform: translate(-50%,calc(-50% - 18px)) scale(1.05) rotate(-4deg); } 52% { transform: translate(-50%,calc(-50% - 10px)) scale(1.05) rotate(4deg); } 100% { left: var(--to-x); top: var(--to-y); transform: translate(-50%,-50%) scale(1); } }
.world-stage-label { position: absolute; z-index: 10; right: 19px; bottom: 17px; display: grid; justify-items: end; color: var(--white); text-shadow: 0 2px var(--night); }
.world-stage-label span { font-family: var(--font-mono); font-size: 8px; font-weight: 900; letter-spacing: .12em; }
.world-stage-label strong { font-family: var(--font-display); font-size: 23px; text-transform: uppercase; }
.map-action-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 24px; padding-bottom: 18px; }
.map-action-row p { margin: 0; color: var(--ink-soft); font-size: 12px; }
.map-action-row p strong { color: var(--blue-dark); font-size: 18px; }
.map-action-row .button--quiet { border-color: var(--line-strong); color: var(--ink); background: rgba(255,255,255,.75); }
.map-action-row .button--quiet:hover { color: var(--white); background: var(--night); }

.screen--reflection { display: grid; min-height: 610px; place-items: center; }
.reflection-scene { position: relative; width: min(910px, 100%); padding: 90px 0 20px; }
.reflection-scene::before { position: absolute; z-index: -1; top: 0; left: 50%; width: 440px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(70,216,220,.28), transparent 68%); content: ""; transform: translateX(-50%); }
.reflection-avatar { position: absolute; z-index: 2; top: 30px; left: 50%; display: grid; place-items: center; width: 90px; height: 102px; border: 5px solid var(--white); color: var(--white); background: var(--coral); clip-path: polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%); filter: drop-shadow(0 12px 8px rgba(15,23,40,.2)); font-family: var(--font-display); font-size: 38px; transform: translateX(-50%); }
.reflection-avatar.avatar-pixel { background: var(--blue); }.reflection-avatar.avatar-sprout { background: var(--green); }.reflection-avatar.avatar-orbit { background: var(--violet); }
.reflection-card { padding: 58px clamp(22px, 6vw, 64px) 35px; border: 3px solid var(--night); border-radius: 21px; background: var(--white); box-shadow: 0 12px 0 #b5c7df, var(--shadow); text-align: center; }
.reflection-card h1 { max-width: 700px; margin: 0 auto; font-family: var(--font-display); font-size: clamp(42px, 6vw, 72px); line-height: .92; text-transform: uppercase; }
.reflection-card > p:not(.screen-kicker) { max-width: 610px; margin: 16px auto 0; color: var(--ink-soft); }
.reflection-choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 15px; margin: 28px 0 17px; }
.reflection-choice { display: grid; grid-template-columns: 48px 1fr; align-items: center; gap: 3px 12px; min-height: 116px; padding: 15px; border: 2px solid var(--line-strong); border-radius: 14px; color: var(--ink); background: var(--paper-blue); box-shadow: 0 5px 0 var(--line-strong); text-align: left; transition: transform .16s ease, box-shadow .16s ease; }
.reflection-choice:hover { transform: translateY(-4px); box-shadow: 0 9px 0 var(--line-strong); }

/* -------------------------------------------------------------------------- */
/* World art pass                                                             */
/* Data supplies the palette, landmarks, and route geometry. These primitives */
/* deliberately use CSS shapes so the single-file build stays dependency-free. */
/* -------------------------------------------------------------------------- */
.rpg-world {
  background:
    radial-gradient(circle at 82% 18%, color-mix(in srgb, var(--scene-sun) 22%, transparent), transparent 17%),
    linear-gradient(180deg, var(--scene-sky) 0 53%, var(--scene-horizon) 53% 100%);
}
.rpg-world::before {
  opacity: .23;
  background-image:
    linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
  background-size: 46px 46px;
}
.rpg-world::after { background: color-mix(in srgb, var(--scene-terrain) 88%, #102b36); box-shadow: -220px 45px 0 45px color-mix(in srgb, var(--scene-terrain) 80%, #5dab62), -470px 61px 0 70px color-mix(in srgb, var(--scene-terrain) 72%, #6bb266), -720px 34px 0 45px color-mix(in srgb, var(--scene-terrain) 82%, #529a5a); }
.world-haze { position: absolute; inset: 0; background: radial-gradient(ellipse at 48% 53%, transparent 20%, color-mix(in srgb, var(--scene-haze) 28%, transparent) 78%, transparent); mix-blend-mode: screen; }
.world-sun { background: var(--scene-sun); box-shadow: 0 0 0 14px color-mix(in srgb, var(--scene-sun) 22%, transparent), 0 0 44px color-mix(in srgb, var(--scene-sun) 34%, transparent); }
.mountain { background: var(--scene-mountain); filter: saturate(.85); }
.mountain--two { opacity: .83; }
.terrain--front { background: var(--scene-terrain); }
.quest-path path { stroke: color-mix(in srgb, var(--scene-sun) 74%, #fff4c7); stroke-width: 24px; stroke-dasharray: 1 12; animation: route-flow 2.2s linear infinite; }
@keyframes route-flow { to { stroke-dashoffset: -26px; } }

.world-landmark:not(.start-camp) { z-index: 2; display: grid; justify-items: center; gap: 5px; color: var(--ink); pointer-events: none; transform: translate(-50%, -50%); filter: drop-shadow(0 7px 4px rgba(15,23,40,.16)); }
.world-landmark:not(.start-camp) small { padding: 3px 6px; border: 1px solid rgba(255,255,255,.74); border-radius: 4px; color: var(--white); background: rgba(15,23,40,.72); font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
.landmark-art { position: relative; display: grid; place-items: center; width: 68px; height: 60px; border: 3px solid rgba(15,23,40,.82); border-radius: 10px 10px 7px 7px; color: var(--white); background: var(--scene-accent); box-shadow: inset 0 -8px rgba(15,23,40,.14), 0 8px 0 rgba(15,23,40,.18); }
.landmark-art::before, .landmark-art::after, .landmark-art i, .landmark-art b { position: absolute; display: block; content: ""; }
.landmark-art::before { top: -14px; width: 54px; height: 22px; border: 3px solid rgba(15,23,40,.82); border-bottom: 0; border-radius: 8px 8px 0 0; background: color-mix(in srgb, var(--scene-accent) 72%, white); }
.landmark-art::after { right: 9px; bottom: 9px; width: 12px; height: 21px; border: 2px solid rgba(255,255,255,.72); border-radius: 3px 3px 0 0; background: rgba(15,23,40,.45); }
.landmark-art i { left: 10px; bottom: 13px; width: 22px; height: 13px; border: 2px solid rgba(255,255,255,.78); border-radius: 3px; background: rgba(255,255,255,.25); }
.landmark-art b { top: 12px; left: 50%; width: 7px; height: 7px; border-radius: 50%; background: var(--scene-sun); box-shadow: 0 0 9px var(--scene-sun); transform: translateX(-50%); }
.landmark-art--circuit, .landmark-art--chart, .landmark-art--beacon { width: 48px; height: 78px; border-radius: 8px 8px 4px 4px; }
.landmark-art--circuit::before, .landmark-art--chart::before, .landmark-art--beacon::before { top: -22px; width: 18px; height: 25px; border: 3px solid rgba(15,23,40,.82); border-bottom: 0; border-radius: 50% 50% 0 0; background: color-mix(in srgb, var(--scene-accent) 65%, white); }
.landmark-art--circuit i { left: 12px; bottom: 16px; width: 22px; height: 26px; border: 2px solid rgba(255,255,255,.75); background: repeating-linear-gradient(90deg, transparent 0 4px, rgba(255,255,255,.55) 4px 6px); }
.landmark-art--chart { border-radius: 50%; background: color-mix(in srgb, var(--scene-accent) 60%, #101a3d); }
.landmark-art--chart::before { border-radius: 50%; border: 3px solid rgba(255,255,255,.8); background: transparent; }
.landmark-art--chart i { left: 10px; bottom: 20px; width: 28px; height: 2px; border: 0; background: var(--scene-sun); transform: rotate(-28deg); box-shadow: 7px -9px var(--scene-sun), 15px -3px var(--scene-sun); }
.landmark-art--beacon { background: color-mix(in srgb, var(--scene-accent) 80%, #11162b); }
.landmark-art--beacon b { width: 18px; height: 18px; border: 3px solid var(--scene-sun); background: transparent; box-shadow: 0 0 0 8px color-mix(in srgb, var(--scene-sun) 16%, transparent), 0 0 20px var(--scene-sun); }
.landmark-art--observatory, .landmark-art--pavilion { border-radius: 50% 50% 8px 8px; }
.landmark-art--observatory::before, .landmark-art--pavilion::before { top: -17px; width: 75px; height: 30px; border: 3px solid rgba(15,23,40,.82); border-bottom: 0; border-radius: 50% 50% 0 0; }
.landmark-art--observatory i { left: 50%; bottom: 14px; width: 26px; height: 26px; border: 3px solid var(--scene-sun); border-radius: 50%; background: rgba(255,255,255,.17); transform: translateX(-50%); }
.landmark-art--bridge { width: 90px; height: 38px; margin-top: 20px; border-radius: 18px 18px 5px 5px; background: color-mix(in srgb, var(--scene-accent) 75%, #fff); }
.landmark-art--bridge::before { top: -26px; width: 90px; height: 42px; border: 4px solid rgba(15,23,40,.82); border-bottom: 0; border-radius: 50% 50% 0 0; background: transparent; }
.landmark-art--bridge i { left: 13px; bottom: 7px; width: 9px; height: 17px; border: 0; background: rgba(15,23,40,.4); box-shadow: 19px 0 rgba(15,23,40,.4), 38px 0 rgba(15,23,40,.4), 57px 0 rgba(15,23,40,.4); }
.landmark-art--plaza { width: 78px; height: 50px; border-radius: 50%; background: color-mix(in srgb, var(--scene-accent) 78%, white); }
.landmark-art--plaza::before { top: -18px; width: 43px; height: 30px; border: 3px solid rgba(15,23,40,.82); border-bottom: 0; border-radius: 50% 50% 0 0; background: transparent; }
.landmark-art--plaza i { left: 16px; bottom: 11px; width: 8px; height: 13px; border: 0; border-radius: 50%; background: var(--scene-sun); box-shadow: 19px 0 var(--scene-sun), 38px 0 var(--scene-sun); }

.map-avatar { gap: 2px; }
.map-avatar::after { position: absolute; z-index: -1; bottom: -6px; width: 48px; height: 11px; border-radius: 50%; background: rgba(15,23,40,.28); content: ""; filter: blur(2px); }
.map-avatar > .avatar-shell { position: relative; display: grid; place-items: center; width: 58px; height: 68px; border: 4px solid var(--white); border-radius: 20px 20px 15px 15px; color: var(--white); background: var(--coral); box-shadow: inset 0 -10px rgba(15,23,40,.16), 0 6px 0 rgba(15,23,40,.25); }
.avatar-shell::before { position: absolute; top: 9px; width: 29px; height: 24px; border: 2px solid rgba(255,255,255,.72); border-radius: 50%; background: rgba(15,23,40,.22); content: ""; }
.avatar-shell::after { position: absolute; bottom: -6px; width: 36px; height: 15px; border-radius: 50% 50% 6px 6px; background: color-mix(in srgb, var(--coral) 65%, #142039); content: ""; }
.avatar-face { position: relative; z-index: 1; margin-top: -2px; color: var(--white); font-size: 22px; font-style: normal; line-height: 1; }
.avatar-spark { position: absolute; z-index: 2; top: 7px; right: 7px; color: var(--scene-sun, var(--gold)); font-size: 14px; line-height: 1; }
.map-avatar.avatar-pixel > .avatar-shell { background: var(--blue); }.map-avatar.avatar-pixel .avatar-shell::after { background: color-mix(in srgb, var(--blue) 65%, #142039); }
.map-avatar.avatar-sprout > .avatar-shell { background: var(--green); }.map-avatar.avatar-sprout .avatar-shell::after { background: color-mix(in srgb, var(--green) 65%, #142039); }
.map-avatar.avatar-orbit > .avatar-shell { background: var(--violet); }.map-avatar.avatar-orbit .avatar-shell::after { background: color-mix(in srgb, var(--violet) 65%, #142039); }
.map-avatar.is-arrived { animation: avatar-arrive .62s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes avatar-arrive {
  0% { transform: translate(-50%, calc(-50% + 8px)); opacity: .25; }
  100% { transform: translate(-50%, -50%); opacity: 1; }
}

 * Information Systems Career Launchpad data
 *
 * This file is intentionally the single source of truth for the map.  Mini-games
 * are currently placeholders; each placeholder has a stable id and metadata so a
 * future game can replace it without changing the progression state machine.
 */

/**
 * @typedef {Object} EarnedSkill
 * @property {string} id Stable skill id used by the skill-stack renderer.
 * @property {string} label Student-facing skill label.
 * @property {string} category Foundation, domain, or specialization skill.
 */

/**
 * @typedef {Object} MiniGamePlan
 * @property {string} id Stable mini-game id.
 * @property {string} title Planned game title.
 * @property {string} concept One-sentence description of the future interaction.
 * @property {number} durationSeconds Target play time for the future game.
 * @property {string} instructions Placeholder instructions shown before implementation.
 * @property {"planned"|"ready"} status Implementation status.
 * @property {string} visualType Renderer hint for the future game workspace.
 */

/**
 * @typedef {Object} MapNode
 * @property {string} id Stable map-node id.
 * @property {1|2|3} tier 1 = region, 2 = domain, 3 = specialization/career match.
 * @property {string|null} parentId Parent map-node id, or null for a region.
 * @property {string} title Map title.
 * @property {string} subtitle Short map label.
 * @property {string} description Student-facing explanation.
 * @property {string} color Hex color token for the branch.
 * @property {string} theme Theme name used by the visual renderer.
 * @property {EarnedSkill} earnedSkill Skill awarded when the placeholder is skipped/completed.
 * @property {MiniGamePlan} miniGame Planned mini-game metadata.
 * @property {string|null} careerId Career-result id for tier-three nodes.
 */

/**
 * @typedef {Object} CareerProfile
 * @property {string} id Stable career id.
 * @property {string} title Exact career title shown in the result card.
 * @property {string} summary Editable role summary.
 * @property {string[]} dayToDay Typical day-to-day responsibilities.
 * @property {string[]} typicalProjects Example projects to expand with research later.
 * @property {string[]} workSettings Places this role commonly works.
 * @property {string[]} industries Example industries.
 * @property {string[]} companyTypes Example employer types.
 * @property {string[]} technicalSkills Technical preparation areas.
 * @property {string[]} toolsAndTechnologies Tools to verify and expand through research.
 * @property {string[]} entryLevelNeeds Editable preparation checklist.
 * @property {{status:string,range:string|null,source:string|null,note:string}} salary Salary is intentionally unresearched in v1.
 * @property {string[]} careerGrowth Potential next steps.
 * @property {{skills:string[],experience:string[],projects:string[],certifications:string[]}} strongCandidate Candidate profile fields.
 * @property {string[]} sourceRefs Source-ledger ids to add when research is completed.
 * @property {"research-pending"|"researched"} researchStatus Content research status.
 */

/** @param {string} id @param {string} label @param {string} category */
function makeSkill(id, label, category) {
  return { id, label, category };
}

/**
 * @param {string} id
 * @param {string} title
 * @param {string} concept
 * @param {string} visualType
 * @param {string} instructions
 * @returns {MiniGamePlan}
 */
function makeMiniGame(id, title, concept, visualType, instructions) {
  return {
    id,
    title,
    concept,
    durationSeconds: 60,
    instructions,
    status: "planned",
    visualType,
  };
}

/**
 * @param {Object} input
 * @param {string} input.id
 * @param {1|2|3} input.tier
 * @param {string|null} input.parentId
 * @param {string} input.title
 * @param {string} input.subtitle
 * @param {string} input.description
 * @param {string} input.color
 * @param {string} input.theme
 * @param {Object} [input.scene] Data-driven art direction for top-level worlds.
 * @param {EarnedSkill} input.earnedSkill
 * @param {MiniGamePlan} input.miniGame
 * @param {string|null} [input.careerId]
 * @returns {MapNode}
 */
function makeNode(input) {
  return {
    id: input.id,
    tier: input.tier,
    parentId: input.parentId,
    title: input.title,
    subtitle: input.subtitle,
    description: input.description,
    color: input.color,
    theme: input.theme,
    scene: input.scene || null,
    earnedSkill: input.earnedSkill,
    miniGame: input.miniGame,
    careerId: input.careerId || null,
  };
}
