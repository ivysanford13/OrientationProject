<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f1728">
    <meta name="description" content="IS Career Launchpad — a playful career exploration game for BYU Information Systems students.">
    <title>IS Career Launchpad</title>
    <style>/*
 * IS Career Launchpad — “paper map / neon terminal” visual system
 * The scene is intentionally tactile: a midnight desk, map cards as labels,
 * and a bottom honeycomb that makes progression visible without relying on color.
 */
:root {
  --ink: #152238;
  --ink-soft: #4f637d;
  --night: #0f1728;
  --night-2: #16243b;
  --paper: #fbfcff;
  --paper-blue: #eef4ff;
  --line: #ccd9ec;
  --line-strong: #94a9c8;
  --blue: #2770e8;
  --blue-dark: #174fb0;
  --violet: #7b43e6;
  --violet-dark: #4f25a6;
  --green: #00a477;
  --green-dark: #007559;
  --gold: #ffb647;
  --coral: #ff6f5b;
  --cyan: #46d8dc;
  --white: #fff;
  --shadow: 0 16px 40px rgba(21, 34, 56, .13);
  --shadow-tight: 0 8px 18px rgba(21, 34, 56, .14);
  --radius-card: 18px;
  --radius-pill: 999px;
  --font-display: Impact, Haettenschweiler, "Arial Black", sans-serif;
  --font-body: "Trebuchet MS", Verdana, sans-serif;
  --font-mono: "Courier New", Courier, monospace;
  --dock-height: 126px;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html { min-width: 320px; scroll-padding-bottom: calc(var(--dock-height) + 28px); background: var(--night); }

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  padding-bottom: var(--dock-height);
  color: var(--ink);
  background:
    radial-gradient(circle at 88% 8%, rgba(70, 216, 220, .15), transparent 29rem),
    radial-gradient(circle at 10% 48%, rgba(123, 67, 230, .16), transparent 32rem),
    linear-gradient(152deg, #f4f8ff 0%, #f8faff 55%, #edf4fb 100%);
  font-family: var(--font-body);
  line-height: 1.45;
}

body::before {
  position: fixed;
  z-index: 20;
  inset: 0;
  pointer-events: none;
  opacity: .07;
  content: "";
  background-image: repeating-linear-gradient(0deg, rgba(13, 26, 49, .22) 0 1px, transparent 1px 4px);
  mix-blend-mode: multiply;
}

button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }

button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}

.skip-link {
  position: fixed;
  z-index: 100;
  top: 10px;
  left: 10px;
  padding: 10px 16px;
  border-radius: var(--radius-pill);
  color: var(--night);
  background: var(--gold);
  font-weight: 800;
  transform: translateY(-160%);
  transition: transform .18s ease;
}
.skip-link:focus { transform: translateY(0); }

.site-header {
  position: relative;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 78px;
  padding: 15px clamp(18px, 4vw, 64px);
  color: var(--white);
  background: var(--night);
  box-shadow: 0 5px 0 rgba(20, 34, 57, .1), 0 13px 30px rgba(15, 23, 40, .14);
}

.brand-lockup { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  position: relative;
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  color: var(--night);
  background: var(--gold);
  clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0 50%);
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: .06em;
}
.brand-mark i { position: absolute; right: 7px; bottom: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--coral); }
.eyebrow { margin: 0; color: var(--cyan); font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: .11em; }
.brand-name { margin: 1px 0 0; font-family: var(--font-display); font-size: clamp(18px, 2vw, 23px); letter-spacing: .08em; line-height: 1; }
.brand-name span { color: var(--gold); }
.header-status { display: flex; align-items: center; gap: 10px; color: #b9c8e3; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; }
.status-lamp { width: 9px; height: 9px; border: 2px solid var(--cyan); border-radius: 50%; box-shadow: 0 0 0 4px rgba(70, 216, 220, .13), 0 0 14px var(--cyan); }

#app { position: relative; z-index: 1; min-height: calc(100vh - 78px); padding: clamp(34px, 6vw, 82px) clamp(16px, 5vw, 72px) 180px; }
.screen { width: min(1240px, 100%); margin: 0 auto; animation: screen-in .45s cubic-bezier(.2, .7, .25, 1) both; }
@keyframes screen-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

.screen-kicker { margin: 0 0 10px; color: var(--blue-dark); font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
.screen-title { max-width: 850px; margin: 0; color: var(--ink); font-family: var(--font-display); font-size: clamp(42px, 7vw, 86px); font-weight: 900; letter-spacing: -.015em; line-height: .94; text-transform: uppercase; }
.screen-title em { color: var(--blue); font-style: normal; }
.screen-subtitle { max-width: 660px; margin: 18px 0 0; color: var(--ink-soft); font-size: clamp(16px, 2vw, 20px); }
.screen-heading-row { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 30px; }
.screen-heading-row .screen-title { font-size: clamp(34px, 5vw, 62px); }

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 11px 20px;
  border: 2px solid transparent;
  border-radius: 10px;
  color: var(--white);
  background: var(--blue);
  box-shadow: 0 5px 0 var(--blue-dark), var(--shadow-tight);
  font-weight: 900;
  letter-spacing: .03em;
  transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
}
.button:hover { background: #3b80ef; transform: translateY(-2px); box-shadow: 0 7px 0 var(--blue-dark), var(--shadow-tight); }
.button:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--blue-dark); }
.button-secondary { color: var(--blue-dark); border-color: var(--line-strong); background: var(--white); box-shadow: 0 4px 0 var(--line-strong); }
.button-secondary:hover { color: var(--ink); background: var(--paper-blue); box-shadow: 0 6px 0 var(--line-strong); }
.button-quiet { min-height: 44px; padding: 7px 12px; border-color: #40526f; color: #dce7f9; background: transparent; box-shadow: none; font-size: 11px; }
.button-quiet:hover { color: var(--white); background: #263752; box-shadow: none; }
.button-coral { background: var(--coral); box-shadow: 0 5px 0 #c84545, var(--shadow-tight); }
.button-coral:hover { background: #ff826d; box-shadow: 0 7px 0 #c84545, var(--shadow-tight); }

.hero-screen { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(300px, .9fr); align-items: center; gap: clamp(28px, 7vw, 100px); min-height: 520px; }
.hero-copy { position: relative; }
.hero-copy::before { position: absolute; z-index: -1; top: -58px; left: -55px; width: 210px; height: 210px; border-radius: 50%; background: rgba(70, 216, 220, .18); content: ""; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 13px; margin-top: 31px; }
.hero-note { display: flex; align-items: center; gap: 8px; margin: 26px 0 0; color: var(--ink-soft); font-family: var(--font-mono); font-size: 11px; }
.hero-note b { color: var(--coral); font-size: 16px; }

.launch-card { position: relative; padding: 30px 27px 26px; border: 2px solid #c6d6ed; border-radius: var(--radius-card); background: rgba(255, 255, 255, .83); box-shadow: var(--shadow); transform: rotate(1.2deg); }
.launch-card::before { position: absolute; top: -14px; left: 20%; width: 76px; height: 24px; border-radius: 2px; background: rgba(255, 182, 71, .72); box-shadow: 0 2px 4px rgba(21, 34, 56, .1); content: ""; transform: rotate(-4deg); }
.launch-card::after { position: absolute; inset: 10px; border: 1px dashed #c7d5e8; border-radius: 12px; pointer-events: none; content: ""; }
.card-label { margin: 0 0 13px; color: var(--violet); font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.terminal-lines { display: grid; gap: 14px; margin: 20px 0 27px; }
.terminal-line { display: grid; grid-template-columns: 35px 1fr; align-items: center; gap: 10px; }
.terminal-line > span:first-child { display: grid; place-items: center; width: 31px; height: 31px; border: 2px solid var(--line-strong); border-radius: 50%; color: var(--blue-dark); font-family: var(--font-mono); font-size: 12px; font-weight: 700; }
.terminal-line p { margin: 0; color: var(--ink); font-size: 14px; font-weight: 700; }
.terminal-line small { display: block; margin-top: 2px; color: var(--ink-soft); font-size: 11px; font-weight: 400; }

.avatar-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; margin: 29px 0; }
.avatar-choice { position: relative; min-height: 126px; padding: 13px; border: 2px solid var(--line); border-radius: 14px; color: var(--ink); background: var(--white); text-align: left; transition: border-color .16s ease, transform .16s ease, box-shadow .16s ease; }
.avatar-choice:hover { border-color: var(--blue); transform: translateY(-3px); box-shadow: var(--shadow-tight); }
.avatar-choice.is-selected { border-color: var(--gold); box-shadow: inset 0 0 0 3px rgba(255, 182, 71, .25), var(--shadow-tight); }
.avatar-choice.is-selected::after { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--green); content: ""; }
.avatar-portrait { display: grid; place-items: center; width: 53px; height: 53px; margin-bottom: 10px; border: 3px solid var(--ink); border-radius: 18px 18px 21px 9px; color: var(--white); background: var(--blue); font-family: var(--font-display); font-size: 23px; }
.avatar-choice:nth-child(2) .avatar-portrait { background: var(--violet); border-radius: 50% 50% 16px 16px; }
.avatar-choice:nth-child(3) .avatar-portrait { background: var(--green); border-radius: 11px 24px 11px 24px; }
.avatar-choice:nth-child(4) .avatar-portrait { background: var(--coral); border-radius: 50% 13px 50% 13px; }
.avatar-name { display: block; font-weight: 900; font-size: 13px; }
.avatar-tag { display: block; margin-top: 2px; color: var(--ink-soft); font-family: var(--font-mono); font-size: 10px; }

.skill-picker { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin: 32px 0; }
.skill-card { display: flex; min-height: 102px; align-items: center; gap: 13px; padding: 14px; border: 2px solid var(--line); border-radius: 15px; color: var(--ink); background: rgba(255,255,255,.83); text-align: left; transition: transform .16s ease, border-color .16s ease, background .16s ease; }
.skill-card:hover { border-color: var(--blue); background: var(--white); transform: translateY(-2px); }
.skill-card.is-selected { border-color: var(--green); background: #f0fffa; box-shadow: inset 0 0 0 2px rgba(0, 164, 119, .12); }
.skill-glyph, .mini-glyph { display: grid; flex: 0 0 47px; place-items: center; width: 47px; height: 54px; color: var(--white); background: var(--blue); clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); font-family: var(--font-display); font-size: 17px; }
.skill-card:nth-child(3n) .skill-glyph { background: var(--violet); }
.skill-card:nth-child(3n + 1) .skill-glyph { background: var(--green); }
.skill-card strong { display: block; font-size: 14px; }
.skill-card small { display: block; margin-top: 3px; color: var(--ink-soft); font-size: 11px; }
.selection-meter { display: flex; align-items: center; justify-content: space-between; max-width: 430px; margin: 15px 0 0; color: var(--ink-soft); font-family: var(--font-mono); font-size: 12px; }
.meter-track { width: 180px; height: 8px; overflow: hidden; border-radius: 10px; background: #d8e2f1; }
.meter-track i { display: block; width: var(--meter, 0%); height: 100%; border-radius: inherit; background: var(--green); transition: width .3s ease; }

.map-screen { max-width: 1430px; }
.map-intro { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 28px; }
.map-intro .screen-title { font-size: clamp(37px, 5.6vw, 72px); }
.map-progress { min-width: 200px; padding: 13px 15px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.7); color: var(--ink-soft); font-family: var(--font-mono); font-size: 11px; }
.map-progress strong { display: block; margin-bottom: 5px; color: var(--ink); font-size: 14px; }
.map-progress-bar { height: 7px; overflow: hidden; border-radius: 9px; background: #d9e3f1; }
.map-progress-bar i { display: block; width: var(--progress, 16%); height: 100%; border-radius: inherit; background: var(--green); transition: width .4s ease; }
.map-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0 0 22px; color: var(--ink-soft); font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; }
.map-legend span { display: inline-flex; align-items: center; gap: 6px; }
.map-legend i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.map-legend .legend-open { color: var(--blue); }.map-legend .legend-done { color: var(--green); }.map-legend .legend-lock { color: #98a9c0; }
.map-board { position: relative; overflow: hidden; padding: clamp(18px, 4vw, 45px) clamp(12px, 3.5vw, 42px) 35px; border: 2px solid #c5d5eb; border-radius: 24px; background: rgba(244, 248, 255, .72); box-shadow: var(--shadow); }
.map-board::before { position: absolute; inset: 0; opacity: .55; pointer-events: none; content: ""; background-image: linear-gradient(rgba(133, 157, 192, .11) 1px, transparent 1px), linear-gradient(90deg, rgba(133, 157, 192, .11) 1px, transparent 1px); background-size: 40px 40px; }
.map-board::after { position: absolute; right: -75px; bottom: -110px; width: 280px; height: 280px; border-radius: 50%; background: rgba(70, 216, 220, .15); content: ""; }
.map-start { position: relative; z-index: 1; width: min(390px, 90%); margin: 0 auto 35px; padding: 16px 21px; border: 2px solid var(--line-strong); border-radius: 15px; background: var(--white); text-align: center; box-shadow: var(--shadow-tight); }
.map-start::after { position: absolute; bottom: -36px; left: 50%; width: 2px; height: 35px; background: var(--line-strong); content: ""; }
.map-start small { display: block; color: var(--blue-dark); font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: .12em; }
.map-start strong { display: block; margin-top: 5px; font-family: var(--font-display); font-size: clamp(18px, 3vw, 25px); letter-spacing: .02em; text-transform: uppercase; }
.map-regions { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(13px, 2vw, 26px); }
.map-region { position: relative; min-width: 0; }
.map-region:not(:last-child)::after { position: absolute; top: 46px; right: -15px; width: 16px; height: 2px; background: var(--line-strong); content: ""; }
.region-card { min-height: 91px; padding: 15px 15px 13px; border-radius: 15px; color: var(--white); box-shadow: var(--shadow-tight); }
.region-card h2 { margin: 0; font-family: var(--font-display); font-size: clamp(19px, 2.3vw, 28px); letter-spacing: .03em; line-height: 1; text-transform: uppercase; }
.region-card p { margin: 8px 0 0; color: rgba(255,255,255,.83); font-size: 11px; }
.region-build .region-card { background: var(--blue); }.region-analyze .region-card { background: var(--violet); }.region-people .region-card { background: var(--green); }
.map-domain-group { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; margin-top: 28px; }
.map-domain-group::before { position: absolute; top: -16px; left: 25%; width: 50%; height: 15px; border-top: 2px solid var(--line-strong); border-left: 2px solid var(--line-strong); border-right: 2px solid var(--line-strong); content: ""; }
.map-domain { min-width: 0; padding: 14px 11px 11px; border: 2px solid var(--line-strong); border-radius: 13px; background: rgba(255,255,255,.88); box-shadow: 0 4px 0 rgba(148,169,200,.22); }
.map-domain h3 { margin: 0; color: var(--ink); font-size: clamp(13px, 1.5vw, 17px); line-height: 1.08; }
.map-domain p { min-height: 31px; margin: 5px 0 12px; color: var(--ink-soft); font-size: 10px; }
.node-stack { display: grid; gap: 7px; }
.map-node { position: relative; display: block; width: 100%; min-height: 51px; padding: 8px 9px 7px 13px; border: 1px solid var(--line); border-left: 5px solid var(--blue); border-radius: 9px; color: var(--ink); background: var(--paper-blue); text-align: left; transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease; }
.map-node:hover:not(:disabled) { border-color: var(--blue); transform: translateX(3px); box-shadow: 0 4px 9px rgba(39,112,232,.14); }
.map-node strong { display: block; font-size: 11px; line-height: 1.1; }
.map-node small { display: block; margin-top: 3px; color: var(--ink-soft); font-family: var(--font-mono); font-size: 9px; }
.map-node .node-state { position: absolute; top: 8px; right: 8px; width: 9px; height: 9px; border: 2px solid currentColor; border-radius: 50%; color: var(--blue); }
.map-node.is-complete { border-left-color: var(--green); background: #effcf8; }.map-node.is-complete .node-state { color: var(--green); background: var(--green); }
.map-node.is-locked { border-left-color: #9aacbf; color: #7e8fa5; background: #f0f3f8; }.map-node.is-locked .node-state { color: #9aacbf; background: transparent; }
.map-node.is-locked small { color: #8fa0b6; }
.specialization-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; margin-top: 23px; }
.specialization-row .map-node { min-height: 70px; border-left-width: 3px; padding: 10px 8px; text-align: center; }
.specialization-row .map-node strong { font-size: 10px; }.specialization-row .map-node small { font-size: 8px; }
.map-footer { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 29px; color: var(--ink-soft); font-family: var(--font-mono); font-size: 10px; text-align: center; }.map-footer::before, .map-footer::after { width: 60px; height: 1px; background: var(--line); content: ""; }

.career-layout { display: grid; grid-template-columns: minmax(0, .65fr) minmax(0, 1.35fr); gap: 22px; align-items: start; }
.career-identity { position: sticky; top: 22px; padding: 24px; border-radius: 18px; color: var(--white); background: var(--night); box-shadow: var(--shadow); }
.career-identity .mini-glyph { margin-bottom: 17px; background: var(--gold); color: var(--night); }
.career-identity h1 { margin: 0; color: var(--white); font-family: var(--font-display); font-size: clamp(33px, 4vw, 55px); line-height: .95; text-transform: uppercase; }
.career-identity p { margin: 13px 0 0; color: #c4d2e8; font-size: 14px; }
.career-pill-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 21px; }.career-pill { padding: 7px 9px; border: 1px solid #4c6281; border-radius: 7px; color: var(--cyan); font-family: var(--font-mono); font-size: 10px; }
.career-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }.fact-card { padding: 18px; border: 2px solid var(--line); border-radius: 14px; background: var(--white); }.fact-card h2 { margin: 0 0 8px; color: var(--blue-dark); font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }.fact-card p { margin: 0; font-size: 13px; }.fact-card--wide { grid-column: 1 / -1; }
.career-actions { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 21px; }

.mission-screen { width: min(920px, 100%); }
.mission-topline { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 24px; color: var(--ink-soft); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; }.mission-topline strong { color: var(--coral); }
.mission-card { position: relative; overflow: hidden; padding: clamp(23px, 5vw, 43px); border: 2px solid #c5d5eb; border-radius: 21px; background: var(--white); box-shadow: var(--shadow); }.mission-card::before { position: absolute; top: 0; right: 0; width: 38%; height: 7px; background: var(--gold); content: ""; }
.mission-card h1 { max-width: 700px; margin: 0; font-family: var(--font-display); font-size: clamp(33px, 5vw, 60px); line-height: .95; text-transform: uppercase; }.mission-card h1 em { color: var(--blue); font-style: normal; }.mission-card > p { max-width: 650px; margin: 17px 0 0; color: var(--ink-soft); }
.mission-visual { display: grid; place-items: center; min-height: 220px; margin: 27px 0 23px; border: 2px dashed var(--line-strong); border-radius: 14px; background: linear-gradient(135deg, #eef5ff, #f8f2ff); text-align: center; }.mission-visual .placeholder-icon { font-size: 54px; line-height: 1; }.mission-visual strong { display: block; margin-top: 10px; color: var(--ink); font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }.mission-visual small { display: block; margin-top: 6px; color: var(--ink-soft); }.mission-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 13px; }.mission-actions .button-secondary { margin-left: auto; }

.feedback-card { margin-top: 20px; padding: 19px; border-left: 5px solid var(--green); border-radius: 10px; background: #effcf8; }.feedback-card h2 { margin: 0; color: var(--green-dark); font-size: 16px; }.feedback-card p { margin: 7px 0 0; font-size: 13px; }.strong-answer { margin-top: 14px; padding: 13px; border-radius: 8px; background: var(--white); }.strong-answer strong { display: block; margin-bottom: 5px; color: var(--violet-dark); font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }.strong-answer p { margin: 0; font-size: 12px; }

.skill-dock { position: fixed; z-index: 10; right: 0; bottom: 0; left: 0; min-height: var(--dock-height); color: var(--white); background: rgba(15, 23, 40, .97); box-shadow: 0 -9px 35px rgba(15, 23, 40, .2); }
.dock-inner { display: flex; align-items: center; gap: clamp(15px, 3vw, 38px); width: min(1440px, 100%); min-height: var(--dock-height); margin: 0 auto; padding: 12px clamp(14px, 4vw, 56px); }.dock-label { display: flex; flex: 0 0 165px; align-items: center; gap: 10px; }.dock-pip { width: 8px; height: 41px; border-radius: 4px; background: var(--gold); box-shadow: 0 0 15px rgba(255,182,71,.6); }.dock-label h2 { margin: 0; font-family: var(--font-display); font-size: 17px; letter-spacing: .08em; }.dock-label p { margin: 3px 0 0; color: #aebed6; font-family: var(--font-mono); font-size: 10px; line-height: 1.2; }.hex-track { display: flex; flex: 1; align-items: center; gap: 7px; min-width: 0; overflow-x: auto; padding: 4px 2px 9px; scrollbar-width: thin; scrollbar-color: #49617f transparent; }.hex-track::-webkit-scrollbar { height: 5px; }.hex-track::-webkit-scrollbar-thumb { border-radius: 8px; background: #49617f; }.hex-empty { display: flex; align-items: center; gap: 8px; min-width: 142px; color: #9caeca; font-family: var(--font-mono); font-size: 10px; line-height: 1.1; }.hex-empty > span:first-child { display: grid; flex: 0 0 38px; place-items: center; width: 38px; height: 43px; border: 1px dashed #6380a5; color: #91aacb; clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); font-size: 18px; }.hex-item { position: relative; display: grid; flex: 0 0 72px; place-items: center; min-height: 84px; color: var(--night); background: var(--gold); clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); text-align: center; animation: skill-pop .46s cubic-bezier(.2, .9, .3, 1.2) both; }.hex-item:nth-child(3n) { background: var(--cyan); }.hex-item:nth-child(3n + 1) { background: #bda3ff; }.hex-item strong { max-width: 54px; font-size: 10px; line-height: 1.02; }.hex-item small { display: block; margin-top: 4px; font-family: var(--font-mono); font-size: 7px; font-weight: 700; text-transform: uppercase; }.hex-item[aria-label] { cursor: help; }.hex-item:hover { filter: brightness(1.12); transform: translateY(-4px); }.hex-flight { position: fixed; z-index: 50; width: 44px; height: 51px; pointer-events: none; background: var(--gold); clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); animation: skill-flight .7s ease-in-out both; }.dock-tip { flex: 0 0 auto; color: #8fa3c2; font-family: var(--font-mono); font-size: 9px; white-space: nowrap; }.dock-tip span { color: var(--gold); font-size: 17px; vertical-align: -2px; }

/* -------------------------------------------------------------------------- */
/* Runtime view contracts                                                     */
/* These selectors match the small, data-driven renderer in app.js. Keeping  */

.screen--landing { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(290px, .72fr); align-items: center; gap: clamp(28px, 7vw, 100px); min-height: 530px; }

.landing-sky::after { position: absolute; right: 9%; bottom: 8%; width: 230px; height: 100px; border: 2px solid rgba(39,112,232,.17); border-radius: 50%; content: ""; transform: rotate(-15deg); }

.planet { position: absolute; right: 14%; bottom: 17%; width: 150px; height: 150px; border: 11px solid rgba(39,112,232,.15); border-radius: 50%; box-shadow: inset -16px -12px rgba(123,67,230,.1); }.planet::after { position: absolute; top: 55px; left: -30px; width: 190px; height: 22px; border: 3px solid rgba(0,164,119,.2); border-radius: 50%; content: ""; transform: rotate(-18deg); }
.landing-copy { position: relative; z-index: 1; }.landing-copy h1 { max-width: 760px; margin: 0; color: var(--ink); font-family: var(--font-display); font-size: clamp(50px, 7vw, 94px); line-height: .9; text-transform: uppercase; }.landing-copy h1 em { color: var(--blue); font-style: normal; }.landing-copy .lede { max-width: 610px; margin: 21px 0 0; color: var(--ink-soft); font-size: clamp(16px, 2vw, 20px); }.landing-note { position: absolute; right: 0; bottom: -20px; margin: 0; color: var(--ink-soft); font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
.start-card { max-width: 555px; margin-top: 31px; padding: 20px 22px 21px; border: 2px solid #c3d3e9; border-radius: 16px; background: rgba(255,255,255,.91); box-shadow: var(--shadow); }.start-card > label { display: block; margin-bottom: 7px; color: var(--ink); font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }.start-card input { display: block; width: 100%; min-height: 46px; padding: 9px 12px; border: 2px solid var(--line); border-radius: 8px; color: var(--ink); background: #f8faff; font-size: 15px; }.start-card input:focus { border-color: var(--blue); outline: 3px solid rgba(39,112,232,.17); }.start-card fieldset { margin: 17px 0 19px; padding: 0; border: 0; }.start-card legend { margin-bottom: 8px; color: var(--ink-soft); font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }.start-card .avatar-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 0; }.start-card .avatar-choice { display: flex; min-height: 77px; flex-direction: column; align-items: center; justify-content: center; padding: 8px; text-align: center; }.avatar-glyph { display: grid; place-items: center; width: 35px; height: 35px; margin-bottom: 5px; border-radius: 11px; color: var(--white); background: var(--blue); font-family: var(--font-display); font-size: 19px; }.avatar-choice:nth-child(2) .avatar-glyph { background: var(--violet); }.avatar-choice:nth-child(3) .avatar-glyph { background: var(--green); }.avatar-choice:nth-child(4) .avatar-glyph { background: var(--coral); }.start-card .avatar-choice > span:last-child { font-size: 10px; font-weight: 800; }.button--wide { width: 100%; }.button--primary { color: var(--white); background: var(--blue); }.text-button { min-height: 44px; padding: 7px 0; border: 0; color: var(--blue-dark); background: transparent; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }.text-button:hover     <script>/*
 * Information Systems Career Launchpad data
 *
 * This file is intentionally the single source of truth for the map.  Mini-games
 * are currently placeholders; each placeholder has a stable id and metadata so a
 * future game can replace it without changing the progression state machine.

/**
 * @typedef {Object} EarnedSkill
 * @property {string} id Stable skill id used by the skill-stack renderer.
 * @property {string} label Student-facing skill label.
 * @property {string} category Foundation, domain, or specialization skill.
 */

/**
 * @typedef {Object} MiniGamePlan
 * @property {string} id Stable mini-game id.
 * @property {string} title Planned game title.
 * @property {string} concept One-sentence description of the future interaction.
 * @property {number} durationSeconds Target play time for the future game.
 * @property {string} instructions Placeholder instructions shown before implementation.
 * @property {"planned"|"ready"} status Implementation status.
 * @property {string} visualType Renderer hint for the future game workspace.

/**
 * @typedef {Object} MapNode
 * @property {string} id Stable map-node id.
 * @property {1|2|3} tier 1 = region, 2 = domain, 3 = specialization/career match.
 * @property {string|null} parentId Parent map-node id, or null for a region.
 * @property {string} title Map title.
 * @property {string} subtitle Short map label.
 * @property {string} description Student-facing explanation.
 * @property {string} color Hex color token for the branch.
 * @property {string} theme Theme name used by the visual renderer.
 * @property {EarnedSkill} earnedSkill Skill awarded when the placeholder is skipped/completed.
 * @property {MiniGamePlan} miniGame Planned mini-game metadata.
 * @property {string|null} careerId Career-result id for tier-three nodes.
 */

/**
 * @typedef {Object} CareerProfile
 * @property {string} id Stable career id.
 * @property {string} title Exact career title shown in the result card.
 * @property {string} summary Editable role summary.
 * @property {string[]} dayToDay Typical day-to-day responsibilities.
 * @property {string[]} typicalProjects Example projects to expand with research later.
 * @property {string[]} workSettings Places this role commonly works.
 * @property {string[]} industries Example industries.
 * @property {string[]} companyTypes Example employer types.
 * @property {string[]} technicalSkills Technical preparation areas.
 * @property {string[]} toolsAndTechnologies Tools to verify and expand through research.
 * @property {string[]} entryLevelNeeds Editable preparation checklist.
 * @property {{status:string,range:string|null,source:string|null,note:string}} salary Salary is intentionally unresearched in v1.
 * @property {string[]} careerGrowth Potential next steps.
 * @property {{skills:string[],experience:string[],projects:string[],certifications:string[]}} strongCandidate Candidate profile fields.
 * @property {string[]} sourceRefs Source-ledger ids to add when research is completed.
 * @property {"research-pending"|"researched"} researchStatus Content research status.
 */

/** @param {string} id @param {string} label @param {string} category */
function makeSkill(id, label, category) {
  return { id, label, category };
}

/**
 * @param {string} id
 * @param {string} title
 * @param {string} concept
 * @param {string} visualType
 * @param {string} instructions
 * @returns {MiniGamePlan}
 */
function makeMiniGame(id, title, concept, visualType, instructions) {
  return {
    id,
    title,
    concept,
    durationSeconds: 60,
    instructions,
    status: "planned",
    visualType,
  };
}

/**
 * @param {Object} input
 * @param {string} input.id
 * @param {1|2|3} input.tier
 * @param {string|null} input.parentId
 * @param {string} input.title
 * @param {string} input.subtitle
 * @param {string} input.description
 * @param {string} input.color
 * @param {string} input.theme
 * @param {EarnedSkill} input.earnedSkill
 * @param {MiniGamePlan} input.miniGame
 * @param {string|null} [input.careerId]
 * @returns {MapNode}
 */
function makeNode(input) {
  return {
    id: input.id,
    tier: input.tier,
    parentId: input.parentId,
    title: input.title,
    subtitle: input.subtitle,
    description: input.description,
    color: input.color,
    theme: input.theme,
    earnedSkill: input.earnedSkill,
    miniGame: input.miniGame,
    careerId: input.careerId || null,
  };
}

    var skillValue = item.skill || item.earnedSkill || item.rewardSkill || (item.miniGame && (item.miniGame.rewardSkill || item.miniGame.skill)) || fallback.skill || id;
    var skillId = typeof skillValue === 'object' ? String(skillValue.id || skillValue.key || slug(skillValue.name || skillValue.title)) : String(skillValue);
    if (!skillMap[skillId]) skillMap[skillId] = typeof skillValue === 'object' ? Object.assign({ id: skillId, name: skillValue.name || skillValue.label || skillValue.title || skillId, shortName: skillValue.shortName || skillValue.name || skillValue.label || skillId }, skillValue) : { id: skillId, name: titleCase(skillId), shortName: titleCase(skillId) };
    var career = item.career || item.careerMatch || item.outcome || fallback.career || null;
    if (typeof career === 'string') career = { title: career };
    var mini = item.miniGame || item.minigame || item.challenge || fallback.miniGame || {};
    var node = Object.assign({}, item, {
      id: id, parentId: parentId, title: item.title || item.name || fallback.title || titleCase(id), name: item.name || item.title || fallback.name || titleCase(id),
      subtitle: item.subtitle || item.description || fallback.subtitle || '', description: item.description || item.subtitle || fallback.description || '',
      skill: skillId, earnedSkill: skillId, career: career, miniGame: Object.assign({ status: 'planned', rewardSkill: skillId }, mini, { rewardSkill: mini.rewardSkill || skillId }),
      children: children.map(function (child, childIndex) { return normalizeNode(child, childIndex, id, skillMap, (fallback.children || [])[childIndex]); })
    });
    return node;
  }

  function slug(value) { return String(value || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  function titleCase(value) { return String(value || '').replace(/[-_]/g, ' ').replace(/\b\w/g, function (letter) { return letter.toUpperCase(); }); }

  // ---------- State --------------------------------------------------------------

  function defaultState() {
    return { version: 1, screen: 'landing', name: '', avatar: 'comet', completed: [], earned: [], selectedNodeId: null, lastCareerId: null };
  }

  function loadState() {
    var initial = defaultState();
    try {
      var saved = JSON.parse(window.localStorage.getItem(STORAGE_KEY) || 'null');
      if (!saved || saved.version !== 1) return initial;
      return Object.assign(initial, saved, { completed: Array.isArray(saved.completed) ? saved.completed : [], earned: Array.isArray(saved.earned) ? saved.earned : [] });
    } catch (error) { return initial; }
  }

  function saveState() {
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (error) { /* private browsing can disable storage */ }
  }

  function resetState() { state = defaultState(); saveState(); closeModal(); render(); announce('Journey restarted. Choose your explorer.'); }

  function findNode(id, nodes) {
    nodes = nodes || model.regions;
    for (var i = 0; i < nodes.length; i += 1) {
      if (nodes[i].id === id) return nodes[i];
      var found = findNode(id, nodes[i].children || []);
      if (found) return found;
    }
    return null;
  }

  function getDepth(node) { var depth = 0; while (node && node.parentId) { depth += 1; node = findNode(node.parentId); } return depth; }
  function isCompleted(id) { return state.completed.indexOf(id) !== -1; }

  function isVisible(node) {
    if (!node.parentId) return true;
    var parent = findNode(node.parentId);
    // A child opens only after its parent challenge has been acknowledged.
    // This makes the map read as a journey rather than a flat career picker.
    return !!parent && isCompleted(parent.id);
  }

  function skillFor(node) {
    var id = node && (node.earnedSkill || node.skill);
    return model.skills[id] || { id: id || 'new-skill', name: titleCase(id || 'New Skill'), shortName: titleCase(id || 'Skill'), color: '#f6c453' };
  }

  // ---------- Rendering -----------------------------------------------------------

  function render() {
    root.innerHTML = renderScreen();
    renderDock();
    wireEvents();
    window.scrollTo(0, 0);
    focusAfterRender();
  }

  function renderScreen() {
    if (state.screen === 'landing') return renderLanding();
    if (state.screen === 'map') return renderMap();
    if (state.screen === 'mini') return renderMiniGame(findNode(state.selectedNodeId));
    if (state.screen === 'career') return renderCareer(findNode(state.selectedNodeId));
    return renderMap();
  }

  function renderLanding() {
    var avatars = [
      { id: 'comet', label: 'Comet', glyph: '✦' }, { id: 'pixel', label: 'Pixel', glyph: '▦' },
      { id: 'sprout', label: 'Sprout', glyph: '✿' }, { id: 'orbit', label: 'Orbit', glyph: '◉' }
    ];
    return '<section class="screen hero-screen screen--landing" aria-labelledby="welcome-title">' +
      '<div class="landing-sky" aria-hidden="true"><span class="star star--one"></span><span class="star star--two"></span><span class="star star--three"></span><span class="planet"></span></div>' +
      '<div class="hero-copy landing-copy"><p class="screen-kicker">INFORMATION SYSTEMS / FIELD GUIDE 01</p><h1 id="welcome-title" class="screen-title" tabindex="-1">Find the work<br><em>that feels like you.</em></h1><p class="screen-subtitle">Build a little world of skills, follow your curiosity, and meet the IS career paths waiting on the other side.</p>' +
      '<form id="start-form" class="launch-card start-card"><p class="card-label">Start your field guide</p><label for="player-name">What should we call you?</label><input id="player-name" name="playerName" autocomplete="name" maxlength="32" placeholder="Your first name" value="' + escapeHtml(state.name) + '" required><fieldset><legend>Choose your explorer</legend><div class="avatar-grid">' + avatars.map(function (avatar) { return '<button class="avatar-choice' + (state.avatar === avatar.id ? ' is-selected' : '') + '" type="button" data-action="choose-avatar" data-avatar="' + avatar.id + '" aria-pressed="' + (state.avatar === avatar.id) + '"><span class="avatar-portrait" aria-hidden="true">' + avatar.glyph + '</span><span class="avatar-name">' + avatar.label + '</span><small class="avatar-tag">ready to explore</small></button>'; }).join('') + '</div></fieldset><button class="button button--primary button--wide" type="submit">Enter the field guide <span aria-hidden="true">↗</span></button></form>' +
      (state.name ? '<button class="text-button" data-action="resume">Resume ' + escapeHtml(state.name) + '’s journey</button>' : '') + '</div>' +
      '<p class="landing-note">A short, self-guided exploration · no wrong turns</p></section>';
  }

  function renderMap() {
    var allComplete = state.completed.length;
    return '<section class="screen map-screen screen--map" aria-labelledby="map-title"><div class="map-intro"><div><p class="screen-kicker">FIELD GUIDE / MAP</p><h1 id="map-title" class="screen-title" tabindex="-1">Which kind of work<br><em>gives you energy?</em></h1><p class="screen-subtitle">Choose a point that feels natural. Every stop is a planned sixty-second challenge.</p></div><div class="map-side"><div class="map-progress"><strong>' + allComplete + ' discoveries</strong><span>Every skip grows your stack.</span></div><button class="button button--quiet map-restart" data-action="restart">Restart journey</button></div></div><div class="map-legend"><span class="legend-open"><i></i> Open route</span><span class="legend-done"><i></i> Explored</span><span class="legend-lock"><i></i> Ahead</span></div><section class="map-board" aria-labelledby="map-title"><div class="map-start"><small>START / ' + escapeHtml(state.name || 'EXPLORER') + '</small><strong>What gives you energy?</strong></div><div class="map-regions">' + model.regions.map(renderRegion).join('') + '</div><div class="map-footer">SKIP A CHALLENGE · ADD A SKILL · FIND YOUR NEXT PATH</div></section></section>';
  }

  function renderRegion(region) {
    var open = isVisible(region);
    return '<div class="map-region map-region--' + escapeAttr(slug(region.id)) + (open ? '' : ' is-future') + '"><button class="region-card region-ribbon" type="button" data-action="open-node" data-node-id="' + escapeAttr(region.id) + '" ' + (open ? '' : 'disabled') + ' style="--region-color:' + escapeAttr(region.color || '#5b8def') + '" aria-label="' + escapeAttr(region.title + ', earns ' + skillFor(region).name) + '"><span class="region-index">' + escapeHtml(region.number || '') + '</span><span><span class="region-heading">' + escapeHtml(region.title) + '</span><span class="region-description">' + escapeHtml(region.subtitle || region.description || '') + '</span></span><span class="region-skill">+' + escapeHtml(skillFor(region).name) + '</span><span class="node-status" aria-hidden="true">' + (isCompleted(region.id) ? '✓' : '↗') + '</span></button><div class="map-domain-group">' + region.children.map(function (child) { return renderDomain(child, region); }).join('') + '</div></div>';
  }

  function renderDomain(node, region) {
    var open = isVisible(node);
    var done = isCompleted(node.id);
    return '<div class="map-domain ' + (open ? 'is-open' : 'is-locked') + ' ' + (done ? 'is-complete' : '') + '"><button class="map-node map-node--domain" type="button" data-action="open-node" data-node-id="' + escapeAttr(node.id) + '" ' + (open ? '' : 'disabled') + ' aria-label="' + escapeAttr(node.title + (done ? ', explored' : '')) + '"><strong>' + escapeHtml(node.title) + '</strong><small>' + escapeHtml(node.subtitle || '') + '</small><span class="node-state" aria-hidden="true">' + (done ? '✓' : open ? '↗' : '·') + '</span></button><div class="specialization-row">' + node.children.map(renderSpecialization).join('') + '</div></div>';
  }

  function renderSpecialization(node) {
    var open = isVisible(node), done = isCompleted(node.id);
    return '<button class="map-node map-node--specialization ' + (open ? 'is-open' : 'is-locked') + ' ' + (done ? 'is-complete' : '') + '" type="button" data-action="open-node" data-node-id="' + escapeAttr(node.id) + '" ' + (open ? '' : 'disabled') + ' aria-label="' + escapeAttr(node.title + ', ' + (node.career && (node.career.title || node.career.name) || 'career match')) + '"><strong>' + escapeHtml(node.title) + '</strong><small>' + escapeHtml(node.career && (node.career.title || node.career.name) || 'Career match') + '</small><span class="node-state" aria-hidden="true">' + (done ? '✓' : open ? '↗' : '·') + '</span></button>';
  }

  function renderMiniGame(node) {
    if (!node) return renderMap();
    var skill = skillFor(node), mini = node.miniGame || {};
    var done = isCompleted(node.id);
    return '<section class="screen screen--challenge" aria-labelledby="challenge-title"><header class="topbar"><button class="button button--quiet" data-action="back-map">← Back to map</button><span class="progress-chip">' + (done ? 'EXPLORED' : 'NEXT STOP') + '</span><button class="button button--quiet" data-action="restart">Restart</button></header><div class="challenge-layout"><div class="challenge-copy"><p class="eyebrow">' + escapeHtml(node.id) + ' / PLANNED MINI-GAME</p><h1 id="challenge-title" tabindex="-1">' + escapeHtml(mini.title || node.title) + '</h1><p class="lede">' + escapeHtml(mini.description || mini.concept || 'A focused, sixty-second activity is planned for this point on the map.') + '</p><div class="reward-callout"><span class="hex hex--small" style="--skill-color:' + escapeAttr(skill.color || '#f6c453') + '" aria-hidden="true">✦</span><div><span class="eyebrow">YOU WILL ADD</span><strong>' + escapeHtml(skill.name) + '</strong><p>One more tile in your growing skill stack.</p></div></div><div class="challenge-actions"><button class="button button--primary" data-action="skip-node">' + (done ? 'Keep this skill' : 'Skip for now') + ' <span aria-hidden="true">→</span></button><button class="text-button" data-action="back-map">Return to map</button></div></div><div class="placeholder-stage" role="region" aria-label="Planned mini-game workspace"><div class="stage-grid" aria-hidden="true"></div><div class="placeholder-card"><span class="placeholder-icon" aria-hidden="true">⌁</span><span class="eyebrow">GAME SPACE</span><h2>' + escapeHtml(mini.title || 'Mini-game') + '</h2><p>Placeholder ready for a future interactive build.</p><div class="placeholder-meta"><span>~ ' + escapeHtml(mini.durationSeconds || 60) + ' sec</span><span>skill reward</span></div></div></div></div></section>';
  }

  function renderCareer(node) {
    var career = node && node.career || { title: 'Career match', whatTheyDo: 'A career path is ready to explore.' };
    var title = career.title || career.name || 'Career match';
    var candidate = career.candidate || career.strongCandidate;
    if (candidate && typeof candidate === 'object' && !Array.isArray(candidate)) candidate = (candidate.skills || []).concat(candidate.experience || [], candidate.projects || [], candidate.certifications || []);
    var lists = [
      ['Day to day', career.responsibilities || career.dayToDay], ['Typical projects', career.projects || career.typicalProjects],
      ['Where they work', career.workplace || career.workSettings], ['Industries', career.industries], ['Company types', career.companies || career.companyTypes],
      ['Technical skills', career.technicalSkills || career.skills], ['Tools & technology', career.tools || career.toolsAndTechnologies || career.technologies],
      ['Entry-level needs', career.entryLevel || career.entryLevelNeeds], ['Strong candidate', candidate]
    ];
    return '<section class="screen screen--career" aria-labelledby="career-title"><header class="topbar"><button class="button button--quiet" data-action="back-map">← Back to map</button><button class="button button--quiet" data-action="restart">Restart</button></header><div class="career-hero"><p class="eyebrow">' + escapeHtml(node && node.id || '') + ' / CAREER MATCH</p><h1 id="career-title" tabindex="-1">' + escapeHtml(title) + '</h1><p class="lede">' + escapeHtml(career.whatTheyDo || career.summary || 'Explore the kind of work this path opens up.') + '</p><div class="career-hero-meta"><span>Skill unlocked: <strong>' + escapeHtml(skillFor(node).name) + '</strong></span><span>Path complete ✓</span></div></div><div class="career-grid"><div class="career-facts">' + lists.map(function (pair) { return '<section class="fact"><h2>' + escapeHtml(pair[0]) + '</h2>' + renderFactList(pair[1]) + '</section>'; }).join('') + '</div><aside class="career-sidebar"><div class="career-stat"><span class="eyebrow">ENTRY RANGE</span><strong>' + escapeHtml(formatSalary(career.salary)) + '</strong><small>Research-backed salary data will be added in the content phase.</small></div><div class="career-stat"><span class="eyebrow">GROWTH</span><p>' + escapeHtml(formatList(career.growth || career.careerGrowth || 'Build experience, then choose your next direction.')) + '</p></div><button class="button button-coral button--wide" data-action="explore-another">Explore another path ↗</button><button class="text-button" data-action="back-map">View the full map</button></aside></div></section>';
  }

  function renderFact(label, value) {
    var values = Array.isArray(value) ? value : (value ? [value] : ['Add this detail in the content file.']);
    return '<section class="fact"><h2>' + escapeHtml(label) + '</h2><ul>' + values.map(function (item) { return '<li>' + escapeHtml(item) + '</li>'; }).join('') + '</ul></section>';
  }

  function renderFactList(value) {
    var values = Array.isArray(value) ? value : (value ? [value] : ['Add this detail in the content file.']);
    return '<ul>' + values.map(function (item) { return '<li>' + escapeHtml(item) + '</li>'; }).join('') + '</ul>';
  }

  function formatList(value) { return Array.isArray(value) ? value.join(' · ') : String(value || ''); }

  function formatSalary(salary) {
    if (!salary) return 'Research pending';
    if (typeof salary === 'string') return salary;
    if (typeof salary === 'object') {
      var range = salary.range || salary.entryRange || salary.amount;
      if (range) return String(range) + (salary.note ? ' · ' + String(salary.note) : '');
      if (salary.status === 'research-pending') return 'Research pending';
    }
    return 'Research pending';
  }

  function renderDock() {
    if (!dock) return;
    var earned = state.earned.map(function (entry) { return typeof entry === 'string' ? { skillId: entry, nodeId: '' } : entry; });
    var items = earned.map(function (entry, index) {
      var skill = model.skills[entry.skillId] || { id: entry.skillId, name: titleCase(entry.skillId), color: '#f6c453' };
      var node = findNode(entry.nodeId);
      return '<button class="hex-item' + (index === earned.length - 1 && state.lastAward ? ' skill-hex--new' : '') + '" type="button" data-action="inspect-skill" data-skill-id="' + escapeAttr(skill.id) + '" aria-label="' + escapeAttr(skill.name + ' skill, earned from ' + (node ? node.title : 'your journey')) + '" style="--skill-color:' + escapeAttr(skill.color || '#f6c453') + '"><span aria-hidden="true">✦</span><strong>' + escapeHtml(skill.shortName || skill.name) + '</strong><small>' + escapeHtml(skill.category || 'discovery') + '</small></button>';
    });
    dock.className = 'skill-dock' + (items.length ? ' has-skills' : '');
    dock.innerHTML = '<div class="dock-inner"><div class="dock-label"><span class="dock-pip" aria-hidden="true"></span><div><h2>SKILL STACK</h2><p>' + (items.length ? items.length + ' discovered' : 'Your launch kit is empty') + '</p></div></div><div class="hex-track" id="skill-dock-list" role="list" aria-label="Skills earned during this journey">' + (items.length ? items.join('') : '<div class="hex-empty" role="listitem"><span aria-hidden="true">+</span><span>Earn skills<br>as you explore</span></div>') + '</div><div class="dock-tip"><span aria-hidden="true">⌁</span> Each mission adds a new edge</div></div>';
  }

  // ---------- Events and transitions --------------------------------------------

  function wireEvents() {
    root.querySelectorAll('[data-action]').forEach(function (element) { element.addEventListener('click', handleAction); });
    if (dock) dock.querySelectorAll('[data-action]').forEach(function (element) { element.addEventListener('click', handleAction); });
    var form = document.getElementById('start-form');
    if (form) form.addEventListener('submit', handleStart);
  }

  function handleStart(event) {
    event.preventDefault();
    var input = document.getElementById('player-name');
    var name = input && input.value.trim();
    if (!name) { if (input) { input.focus(); input.setCustomValidity('Add your first name to begin.'); input.reportValidity(); } return; }
    if (input) input.setCustomValidity('');
    state.name = name; state.screen = 'map'; saveState(); render(); announce('Welcome, ' + name + '. Choose a starting region.');
  }

  function handleAction(event) {
    var element = event.currentTarget, action = element.getAttribute('data-action');
    if (action === 'choose-avatar') { state.avatar = element.getAttribute('data-avatar') || 'comet'; render(); return; }
    if (action === 'resume') { state.screen = 'map'; saveState(); render(); announce('Journey resumed.'); return; }
    if (action === 'open-node') { openNode(element.getAttribute('data-node-id')); return; }
    if (action === 'skip-node') { completeNode(state.selectedNodeId); return; }
    if (action === 'back-map' || action === 'explore-another') { state.screen = 'map'; state.selectedNodeId = null; saveState(); render(); announce('Back on the map. Choose another point to explore.'); return; }
    if (action === 'restart') { modalReturnFocus = element; showRestartModal(); return; }
    if (action === 'inspect-skill') { modalReturnFocus = element; showSkillModal(element.getAttribute('data-skill-id')); return; }
  }

  function openNode(id) {
    var node = findNode(id);
    if (!node || !isVisible(node)) return;
    state.selectedNodeId = id;
    if (node.children && node.children.length && !node.career) {
      // Domain nodes still get their own planned challenge; its children become available after Skip.
    }
    state.screen = 'mini'; saveState(); render(); announce(node.title + ' opened. Planned mini-game placeholder.');
  }

  function completeNode(id) {
    var node = findNode(id); if (!node) return;
    var alreadyDone = isCompleted(id);
    if (!alreadyDone) state.completed.push(id);
    var skill = skillFor(node);
    var hasReward = state.earned.some(function (entry) { return (typeof entry === 'string' ? entry : entry.nodeId) === id; });
    if (!hasReward) state.earned.push({ skillId: skill.id, nodeId: id, earnedAt: Date.now() });
    state.lastAward = true;
    state.selectedNodeId = id;
    saveState();
    if (node.career) { state.lastCareerId = node.career.id || node.career.title; state.screen = 'career'; saveState(); render(); animateSkillReward(skill); announce('Career match unlocked: ' + (node.career.title || node.career.name) + '.'); return; }
    state.screen = 'map'; saveState(); render();
    if (!alreadyDone) animateSkillReward(skill);
    announce(alreadyDone ? skill.name + ' is already in your stack.' : skill.name + ' added to your skill stack.');
    showToast(alreadyDone ? 'Skill already discovered' : '+' + skill.name + ' added to your stack', skill, !alreadyDone);
    window.setTimeout(function () { state.lastAward = false; renderDock(); }, prefersReducedMotion ? 0 : 850);
  }

  function showToast(message, skill, reward) {
    if (!toastRegion) return;
    toastRegion.innerHTML = '<div class="toast ' + (reward ? 'toast--reward' : '') + '" role="status"><span class="toast-mark" style="--skill-color:' + escapeAttr(skill && skill.color || '#f6c453') + '" aria-hidden="true">✦</span><span>' + escapeHtml(message) + '</span></div>';
    window.setTimeout(function () { if (toastRegion) toastRegion.innerHTML = ''; }, 3200);
  }

  function animateSkillReward(skill) {
    if (prefersReducedMotion || !dock) return;
    var target = dock.getBoundingClientRect();
    var startX = window.innerWidth * 0.5;
    var startY = window.innerHeight * 0.42;
    var endX = Math.min(target.right - 90, target.left + Math.max(250, target.width * 0.42));
    var endY = target.top + 34;
    var flight = document.createElement('span');
    flight.className = 'hex-flight';
    flight.setAttribute('aria-hidden', 'true');
    flight.style.left = startX + 'px';
    flight.style.top = startY + 'px';
    flight.style.setProperty('--skill-color', skill && skill.color || '#f6c453');
    flight.style.setProperty('--flight-x', (endX - startX) + 'px');
    flight.style.setProperty('--flight-y', (endY - startY) + 'px');
    document.body.appendChild(flight);
    window.setTimeout(function () { if (flight.parentNode) flight.parentNode.removeChild(flight); }, 760);
  }

  function announce(message) {
    if (toastRegion) {
      toastRegion.setAttribute('aria-live', 'polite');
      // Keep map/challenge transitions audible even when there is no visual toast.
      toastRegion.innerHTML = '<span class="sr-only" role="status">' + escapeHtml(message) + '</span>';
    }
    if (window.console && window.console.debug) window.console.debug('[Launchpad]', message);
  }

  // ---------- Small modal surfaces ------------------------------------------------

  function showRestartModal() {
    if (!modalRoot) { resetState(); return; }
    setModalSurfaces(true);
    modalRoot.innerHTML = '<div class="modal-backdrop" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="restart-title"><button class="modal-close" data-action="close-modal" aria-label="Close">×</button><p class="eyebrow">RESET FIELD GUIDE</p><h2 id="restart-title">Start a fresh journey?</h2><p>Your current name, map progress, and skill stack will be cleared from this browser.</p><div class="modal-actions"><button class="button button--quiet" data-action="close-modal">Keep exploring</button><button class="button button--danger" data-action="confirm-restart">Restart journey</button></div></section></div>';
    modalRoot.querySelectorAll('[data-action]').forEach(function (element) { element.addEventListener('click', function (event) { if (event.target === event.currentTarget && element.getAttribute('data-action') === 'close-modal') closeModal(); else if (element.getAttribute('data-action') === 'close-modal') closeModal(); else if (element.getAttribute('data-action') === 'confirm-restart') resetState(); }); });
    var close = modalRoot.querySelector('.modal-close'); if (close) close.focus();
  }

  function showSkillModal(skillId) {
    var skill = model.skills[skillId] || { name: titleCase(skillId), color: '#f6c453' };
    var earned = state.earned.find(function (entry) { return (typeof entry === 'string' ? entry : entry.skillId) === skillId; });
    var node = earned && typeof earned !== 'string' ? findNode(earned.nodeId) : null;
    if (!modalRoot) return;
    setModalSurfaces(true);
    modalRoot.innerHTML = '<div class="modal-backdrop" data-action="close-modal"><section class="modal modal--skill" role="dialog" aria-modal="true" aria-labelledby="skill-title"><button class="modal-close" data-action="close-modal" aria-label="Close">×</button><span class="hex hex--modal" style="--skill-color:' + escapeAttr(skill.color || '#f6c453') + '" aria-hidden="true">✦</span><p class="eyebrow">SKILL DISCOVERED</p><h2 id="skill-title">' + escapeHtml(skill.name) + '</h2><p>' + escapeHtml((node ? 'You found this by exploring “' + node.title + '.”' : 'A building block in your career field guide.')) + '</p><button class="button button--primary button--wide" data-action="close-modal">Back to journey</button></section></div>';
    modalRoot.querySelectorAll('[data-action]').forEach(function (element) { element.addEventListener('click', function () { closeModal(); }); });
    var close = modalRoot.querySelector('.modal-close'); if (close) close.focus();
  }

  function closeModal() {
    if (modalRoot) modalRoot.innerHTML = '';
    setModalSurfaces(false);
    var returnTarget = modalReturnFocus;
    modalReturnFocus = null;
    if (returnTarget && document.body.contains(returnTarget)) returnTarget.focus();
  }

  function setModalSurfaces(isOpen) {
    [root, dock, document.querySelector('.site-header')].forEach(function (surface) {
      if (surface) surface.inert = isOpen;
    });
  }

  function trapModalFocus(event) {
    if (!modalRoot || !modalRoot.innerHTML || event.key !== 'Tab') return;
    var focusable = Array.prototype.slice.call(modalRoot.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')).filter(function (element) { return !element.disabled; });
    if (!focusable.length) { event.preventDefault(); return; }
    var first = focusable[0], last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }

  function focusAfterRender() {
    var target = root.querySelector('h1, input, [data-action="open-node"]');
    if (!target || document.activeElement === target) return;
    window.setTimeout(function () { if (target && document.body.contains(target)) target.focus && target.focus(); }, prefersReducedMotion ? 0 : 40);
  }

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && modalRoot && modalRoot.innerHTML) { closeModal(); return; }
    trapModalFocus(event);
  });

  function escapeHtml(value) { return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
  function escapeAttr(value) { return escapeHtml(value); }

  render();
  window.CareerLaunchpadApp = { render: render, reset: resetState, getState: function () { return state; }, getModel: function () { return model; } };
}());
</script>
