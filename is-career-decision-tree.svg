<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-labelledby="title desc">
  <title id="title">Information Systems Career Decision Tree</title>
  <desc id="desc">A complete decision tree with three initial choices, two branches under each, two skill preferences under each branch, and one career outcome per final choice.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748b"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 58px; font-weight: 760; fill: #0f172a; letter-spacing: -1.5px; }
      .subtitle { font-size: 25px; font-weight: 430; fill: #64748b; }
      .step { font-size: 20px; font-weight: 750; fill: #64748b; letter-spacing: 2px; }
      .start-q { font-size: 31px; font-weight: 710; fill: #0f172a; }
      .group { font-size: 31px; font-weight: 760; fill: #ffffff; letter-spacing: .4px; }
      .group-sub { font-size: 20px; font-weight: 520; fill: #ffffff; opacity: .86; }
      .branch { font-size: 27px; font-weight: 720; fill: #0f172a; }
      .branch-sub { font-size: 19px; font-weight: 520; fill: #64748b; }
      .choice { font-size: 23px; font-weight: 680; fill: #1e293b; }
      .match { font-size: 13px; font-weight: 800; letter-spacing: 1.1px; }
      .career { font-size: 23px; font-weight: 780; fill: #0f172a; }
      .footer { font-size: 24px; font-weight: 520; fill: #475569; }
      .connector { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="2400" height="1600" fill="#f8fafc"/>
  <circle cx="2255" cy="95" r="210" fill="#e0e7ff" opacity=".42"/>
  <circle cx="145" cy="1495" r="245" fill="#d1fae5" opacity=".35"/>

  <g class="sans">
    <text class="title" x="1200" y="84" text-anchor="middle">Which IS Career Fits You?</text>
    <text class="subtitle" x="1200" y="130" text-anchor="middle">At each row, choose the option that feels most natural—not the one you think you should pick.</text>

    <text class="step" x="1200" y="178" text-anchor="middle">START</text>
    <rect x="760" y="198" width="880" height="92" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" filter="url(#shadow)"/>
    <text class="start-q" x="1200" y="255" text-anchor="middle">What kind of work gives you energy?</text>

    <!-- Connectors: start to the three initial options -->
    <path class="connector" d="M1200 290 V326 H400 V350" marker-end="url(#arrow)"/>
    <path class="connector" d="M1200 290 V350" marker-end="url(#arrow)"/>
    <path class="connector" d="M1200 326 H2000 V350" marker-end="url(#arrow)"/>

    <!-- First choice: three options -->
    <rect x="70" y="365" width="660" height="110" rx="27" fill="#2563eb" filter="url(#shadow)"/>
    <text class="group" x="400" y="414" text-anchor="middle">1 · BUILD + CREATE</text>
    <text class="group-sub" x="400" y="448" text-anchor="middle">I like making technology work.</text>

    <rect x="870" y="365" width="660" height="110" rx="27" fill="#7c3aed" filter="url(#shadow)"/>
    <text class="group" x="1200" y="414" text-anchor="middle">2 · ANALYZE + SOLVE</text>
    <text class="group-sub" x="1200" y="448" text-anchor="middle">I like finding answers in complexity.</text>

    <rect x="1670" y="365" width="660" height="110" rx="27" fill="#059669" filter="url(#shadow)"/>
    <text class="group" x="2000" y="414" text-anchor="middle">3 · PEOPLE + LEAD</text>
    <text class="group-sub" x="2000" y="448" text-anchor="middle">I like helping people move forward.</text>

    <!-- Connectors: each initial option to two domains -->
    <path class="connector" d="M400 475 V520 H220 V550" marker-end="url(#arrow)"/>
    <path class="connector" d="M400 520 H580 V550" marker-end="url(#arrow)"/>
    <path class="connector" d="M1200 475 V520 H1020 V550" marker-end="url(#arrow)"/>
    <path class="connector" d="M1200 520 H1380 V550" marker-end="url(#arrow)"/>
    <path class="connector" d="M2000 475 V520 H1820 V550" marker-end="url(#arrow)"/>
    <path class="connector" d="M2000 520 H2180 V550" marker-end="url(#arrow)"/>

    <!-- Second choice: two domains beneath each option -->
    <g>
      <rect x="55" y="565" width="330" height="118" rx="23" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/>
      <text class="branch" x="220" y="614" text-anchor="middle">1.1 · Software &amp; Apps</text>
      <text class="branch-sub" x="220" y="650" text-anchor="middle">Create digital products</text>

      <rect x="415" y="565" width="330" height="118" rx="23" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/>
      <text class="branch" x="580" y="614" text-anchor="middle">1.2 · Systems &amp; Tech</text>
      <text class="branch-sub" x="580" y="650" text-anchor="middle">Keep technology running</text>

      <rect x="855" y="565" width="330" height="118" rx="23" fill="#ffffff" stroke="#c4b5fd" stroke-width="3"/>
      <text class="branch" x="1020" y="614" text-anchor="middle">2.1 · Data &amp; Insights</text>
      <text class="branch-sub" x="1020" y="650" text-anchor="middle">Turn data into answers</text>

      <rect x="1215" y="565" width="330" height="118" rx="23" fill="#ffffff" stroke="#c4b5fd" stroke-width="3"/>
      <text class="branch" x="1380" y="614" text-anchor="middle">2.2 · Security &amp; Risk</text>
      <text class="branch-sub" x="1380" y="650" text-anchor="middle">Protect systems and trust</text>

      <rect x="1655" y="565" width="330" height="118" rx="23" fill="#ffffff" stroke="#6ee7b7" stroke-width="3"/>
      <text class="branch" x="1820" y="614" text-anchor="middle">3.1 · Projects &amp; Delivery</text>
      <text class="branch-sub" x="1820" y="650" text-anchor="middle">Guide work to completion</text>

      <rect x="2015" y="565" width="330" height="118" rx="23" fill="#ffffff" stroke="#6ee7b7" stroke-width="3"/>
      <text class="branch" x="2180" y="614" text-anchor="middle">3.2 · Users &amp; Products</text>
      <text class="branch-sub" x="2180" y="650" text-anchor="middle">Shape useful experiences</text>
    </g>

    <!-- Connectors: each domain to two skill preferences -->
    <g class="connector">
      <path d="M220 683 V728 H125 V760" marker-end="url(#arrow)"/><path d="M220 728 H315 V760" marker-end="url(#arrow)"/>
      <path d="M580 683 V728 H485 V760" marker-end="url(#arrow)"/><path d="M580 728 H675 V760" marker-end="url(#arrow)"/>
      <path d="M1020 683 V728 H925 V760" marker-end="url(#arrow)"/><path d="M1020 728 H1115 V760" marker-end="url(#arrow)"/>
      <path d="M1380 683 V728 H1285 V760" marker-end="url(#arrow)"/><path d="M1380 728 H1475 V760" marker-end="url(#arrow)"/>
      <path d="M1820 683 V728 H1725 V760" marker-end="url(#arrow)"/><path d="M1820 728 H1915 V760" marker-end="url(#arrow)"/>
      <path d="M2180 683 V728 H2085 V760" marker-end="url(#arrow)"/><path d="M2180 728 H2275 V760" marker-end="url(#arrow)"/>
    </g>

    <!-- Third choice: skill preferences -->
    <g>
      <rect x="35" y="775" width="180" height="125" rx="21" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
      <text class="choice" x="125" y="810" text-anchor="middle"><tspan x="125">1.1.1</tspan><tspan x="125" dy="31">Code &amp;</tspan><tspan x="125" dy="31">build UIs</tspan></text>
      <rect x="225" y="775" width="180" height="125" rx="21" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
      <text class="choice" x="315" y="797" text-anchor="middle"><tspan x="315">1.1.2</tspan><tspan x="315" dy="29">Architect</tspan><tspan x="315" dy="29">reliable</tspan><tspan x="315" dy="29">software</tspan></text>
      <rect x="395" y="775" width="180" height="125" rx="21" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
      <text class="choice" x="485" y="797" text-anchor="middle"><tspan x="485">1.2.1</tspan><tspan x="485" dy="29">Deploy</tspan><tspan x="485" dy="29">cloud</tspan><tspan x="485" dy="29">platforms</tspan></text>
      <rect x="585" y="775" width="180" height="125" rx="21" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
      <text class="choice" x="675" y="797" text-anchor="middle"><tspan x="675">1.2.2</tspan><tspan x="675" dy="29">Support</tspan><tspan x="675" dy="29">connected</tspan><tspan x="675" dy="29">systems</tspan></text>

      <rect x="835" y="775" width="180" height="125" rx="21" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
      <text class="choice" x="925" y="797" text-anchor="middle"><tspan x="925">2.1.1</tspan><tspan x="925" dy="29">Explain</tspan><tspan x="925" dy="29">trends with</tspan><tspan x="925" dy="29">data</tspan></text>
      <rect x="1025" y="775" width="180" height="125" rx="21" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
      <text class="choice" x="1115" y="797" text-anchor="middle"><tspan x="1115">2.1.2</tspan><tspan x="1115" dy="29">Predict</tspan><tspan x="1115" dy="29">outcomes with</tspan><tspan x="1115" dy="29">models</tspan></text>
      <rect x="1195" y="775" width="180" height="125" rx="21" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
      <text class="choice" x="1285" y="797" text-anchor="middle"><tspan x="1285">2.2.1</tspan><tspan x="1285" dy="29">Detect &amp;</tspan><tspan x="1285" dy="29">investigate</tspan><tspan x="1285" dy="29">threats</tspan></text>
      <rect x="1385" y="775" width="180" height="125" rx="21" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
      <text class="choice" x="1475" y="797" text-anchor="middle"><tspan x="1475">2.2.2</tspan><tspan x="1475" dy="29">Evaluate</tspan><tspan x="1475" dy="29">controls &amp;</tspan><tspan x="1475" dy="29">risk</tspan></text>

      <rect x="1635" y="775" width="180" height="125" rx="21" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
      <text class="choice" x="1725" y="797" text-anchor="middle"><tspan x="1725">3.1.1</tspan><tspan x="1725" dy="29">Plan</tspan><tspan x="1725" dy="29">timelines &amp;</tspan><tspan x="1725" dy="29">delivery</tspan></text>
      <rect x="1825" y="775" width="180" height="125" rx="21" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
      <text class="choice" x="1915" y="797" text-anchor="middle"><tspan x="1915">3.1.2</tspan><tspan x="1915" dy="29">Improve</tspan><tspan x="1915" dy="29">processes &amp;</tspan><tspan x="1915" dy="29">requirements</tspan></text>
      <rect x="1995" y="775" width="180" height="125" rx="21" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
      <text class="choice" x="2085" y="797" text-anchor="middle"><tspan x="2085">3.2.1</tspan><tspan x="2085" dy="29">Research &amp;</tspan><tspan x="2085" dy="29">design</tspan><tspan x="2085" dy="29">experiences</tspan></text>
      <rect x="2185" y="775" width="180" height="125" rx="21" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
      <text class="choice" x="2275" y="797" text-anchor="middle"><tspan x="2275">3.2.2</tspan><tspan x="2275" dy="29">Set strategy</tspan><tspan x="2275" dy="29">&amp; prioritize</tspan><tspan x="2275" dy="29">value</tspan></text>
    </g>

    <!-- Connectors: one final career from each skill preference -->
    <g class="connector">
      <path d="M125 900 V970" marker-end="url(#arrow)"/><path d="M315 900 V970" marker-end="url(#arrow)"/>
      <path d="M485 900 V970" marker-end="url(#arrow)"/><path d="M675 900 V970" marker-end="url(#arrow)"/>
      <path d="M925 900 V970" marker-end="url(#arrow)"/><path d="M1115 900 V970" marker-end="url(#arrow)"/>
      <path d="M1285 900 V970" marker-end="url(#arrow)"/><path d="M1475 900 V970" marker-end="url(#arrow)"/>
      <path d="M1725 900 V970" marker-end="url(#arrow)"/><path d="M1915 900 V970" marker-end="url(#arrow)"/>
      <path d="M2085 900 V970" marker-end="url(#arrow)"/><path d="M2275 900 V970" marker-end="url(#arrow)"/>
    </g>

    <!-- Career outcomes -->
    <g filter="url(#shadow)">
      <rect x="35" y="990" width="180" height="150" rx="23" fill="#ffffff" stroke="#60a5fa" stroke-width="4"/>
      <text class="match" x="125" y="1026" text-anchor="middle" fill="#2563eb">1.1.1 · CAREER MATCH</text><text class="career" x="125" y="1072" text-anchor="middle"><tspan x="125">Application</tspan><tspan x="125" dy="31">Developer</tspan></text>
      <rect x="225" y="990" width="180" height="150" rx="23" fill="#ffffff" stroke="#60a5fa" stroke-width="4"/>
      <text class="match" x="315" y="1026" text-anchor="middle" fill="#2563eb">1.1.2 · CAREER MATCH</text><text class="career" x="315" y="1072" text-anchor="middle"><tspan x="315">Software</tspan><tspan x="315" dy="31">Engineer</tspan></text>
      <rect x="395" y="990" width="180" height="150" rx="23" fill="#ffffff" stroke="#60a5fa" stroke-width="4"/>
      <text class="match" x="485" y="1026" text-anchor="middle" fill="#2563eb">1.2.1 · CAREER MATCH</text><text class="career" x="485" y="1072" text-anchor="middle"><tspan x="485">Cloud</tspan><tspan x="485" dy="31">Engineer</tspan></text>
      <rect x="585" y="990" width="180" height="150" rx="23" fill="#ffffff" stroke="#60a5fa" stroke-width="4"/>
      <text class="match" x="675" y="1026" text-anchor="middle" fill="#2563eb">1.2.2 · CAREER MATCH</text><text class="career" x="675" y="1072" text-anchor="middle"><tspan x="675">Systems</tspan><tspan x="675" dy="31">Administrator</tspan></text>

      <rect x="835" y="990" width="180" height="150" rx="23" fill="#ffffff" stroke="#a78bfa" stroke-width="4"/>
      <text class="match" x="925" y="1026" text-anchor="middle" fill="#7c3aed">2.1.1 · CAREER MATCH</text><text class="career" x="925" y="1072" text-anchor="middle"><tspan x="925">Data</tspan><tspan x="925" dy="31">Analyst</tspan></text>
      <rect x="1025" y="990" width="180" height="150" rx="23" fill="#ffffff" stroke="#a78bfa" stroke-width="4"/>
      <text class="match" x="1115" y="1026" text-anchor="middle" fill="#7c3aed">2.1.2 · CAREER MATCH</text><text class="career" x="1115" y="1072" text-anchor="middle"><tspan x="1115">Data</tspan><tspan x="1115" dy="31">Scientist</tspan></text>
      <rect x="1195" y="990" width="180" height="150" rx="23" fill="#ffffff" stroke="#a78bfa" stroke-width="4"/>
      <text class="match" x="1285" y="1026" text-anchor="middle" fill="#7c3aed">2.2.1 · CAREER MATCH</text><text class="career" x="1285" y="1059" text-anchor="middle"><tspan x="1285">Cybersecurity</tspan><tspan x="1285" dy="31">Analyst</tspan></text>
      <rect x="1385" y="990" width="180" height="150" rx="23" fill="#ffffff" stroke="#a78bfa" stroke-width="4"/>
      <text class="match" x="1475" y="1026" text-anchor="middle" fill="#7c3aed">2.2.2 · CAREER MATCH</text><text class="career" x="1475" y="1072" text-anchor="middle"><tspan x="1475">IT Risk</tspan><tspan x="1475" dy="31">Analyst</tspan></text>

      <rect x="1635" y="990" width="180" height="150" rx="23" fill="#ffffff" stroke="#34d399" stroke-width="4"/>
      <text class="match" x="1725" y="1026" text-anchor="middle" fill="#059669">3.1.1 · CAREER MATCH</text><text class="career" x="1725" y="1059" text-anchor="middle"><tspan x="1725">IT Project</tspan><tspan x="1725" dy="31">Manager</tspan></text>
      <rect x="1825" y="990" width="180" height="150" rx="23" fill="#ffffff" stroke="#34d399" stroke-width="4"/>
      <text class="match" x="1915" y="1026" text-anchor="middle" fill="#059669">3.1.2 · CAREER MATCH</text><text class="career" x="1915" y="1072" text-anchor="middle"><tspan x="1915">Business</tspan><tspan x="1915" dy="31">Analyst</tspan></text>
      <rect x="1995" y="990" width="180" height="150" rx="23" fill="#ffffff" stroke="#34d399" stroke-width="4"/>
      <text class="match" x="2085" y="1026" text-anchor="middle" fill="#059669">3.2.1 · CAREER MATCH</text><text class="career" x="2085" y="1072" text-anchor="middle"><tspan x="2085">UX</tspan><tspan x="2085" dy="31">Designer</tspan></text>
      <rect x="2185" y="990" width="180" height="150" rx="23" fill="#ffffff" stroke="#34d399" stroke-width="4"/>
      <text class="match" x="2275" y="1026" text-anchor="middle" fill="#059669">3.2.2 · CAREER MATCH</text><text class="career" x="2275" y="1072" text-anchor="middle"><tspan x="2275">Product</tspan><tspan x="2275" dy="31">Manager</tspan></text>
    </g>

    <!-- Bottom guidance -->
    <rect x="390" y="1255" width="1620" height="150" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
    <text class="step" x="1200" y="1300" text-anchor="middle">AFTER ANY CAREER MATCH</text>
    <text class="footer" x="1200" y="1345" text-anchor="middle">Next screen: display 10 careers related to the selected broad match.</text>
    <text class="footer" x="1200" y="1381" text-anchor="middle">For each career show: U.S. salary • typical day-to-day work • brief role explanation.</text>

    <text x="1200" y="1518" text-anchor="middle" font-size="19" font-weight="600" fill="#94a3b8" letter-spacing="1.2">INFORMATION SYSTEMS CAREER EXPLORER</text>
  </g>
</svg>
